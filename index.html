"Texto de autoria própria: “Entreguei o livro ______ professora e pedi que ela ______ devolvesse amanhã.”",
"Preenchem corretamente:",
["a / me","à / me","à / mim","a / mim","há / me"],
1,"'Entreguei o livro à professora' (crase: a + a). 'Pedi que ela me devolvesse' (próclise, pois 'que' é palavra atrativa). As demais formas erram crase e colocação pronominal."
],
"Vírgula: usos e efeitos de sentido":[
"A vírgula marca pausas e separa termos, mas não é livre: ela obedece a funções sintáticas. Usa-se para separar itens de enumeração, isolar aposto e vocativo, separar orações coordenadas, isolar expressões explicativas e deslocadas. Nunca se separa sujeito de predicado nem verbo de complemento.",
["Separa itens","Isola aposto e vocativo","Separa coordenadas","Isola termos deslocados","Não separa sujeito de predicado"],
"Vírgula não é 'respiro': a mudança de lugar pode mudar o sentido: 'Só ele, disse o chefe' ≠ 'Só ele disse o chefe'.",
"Texto de autoria própria: “Maria, minha amiga de infância, chegou ontem de Lisboa.”",
"As duas vírgulas no trecho:",
["Separaram sujeito e predicado, o que é incorreto.","Isolam o aposto explicativo 'minha amiga de infância', o que é correto.","Marcam pausa de leitura, sem função sintática.","Indicam enumeração.","Separam o verbo do complemento."],
1,"O trecho 'minha amiga de infância' é aposto explicativo, e vem isolado por vírgulas. Está correto. As demais alternativas atribuem funções equivocadas ao sinal."
],
"Ponto e vírgula, dois-pontos e travessão":[
"Ponto e vírgula separa itens extensos ou orações coordenadas longas, marcando pausa maior que a vírgula. Dois-pontos introduzem enumeração, explicação, fala ou citação. Travessão isola termos ou introduz a fala em diálogos, em substituição às vírgulas ou parênteses.",
["Ponto e vírgula: pausa intermediária","Dois-pontos: anúncio, explicação, fala","Travessão: diálogo, destaque","Substituem outros sinais com nuances"],
"A escolha entre vírgula, ponto e vírgula e travessão depende da ênfase e da extensão das unidades.",
"Texto de autoria própria: “Trouxe três coisas essenciais: disposição, tempo e coragem.”",
"Os dois-pontos, no trecho, introduzem:",
["Uma fala de personagem.","Uma enumeração explicativa.","Uma citação.","Uma oposição.","Uma consequência."],
1,"'Três coisas essenciais' é anunciado e, em seguida, enumerado (disposição, tempo, coragem). Os dois-pontos introduzem enumeração explicativa. Não há fala (A), citação (C), oposição (D) nem consequência (E)."
],
"Acentuação gráfica":[
"A acentuação gráfica segue regras baseadas na posição da sílaba tônica e na terminação das palavras. Oxítonas terminadas em a, e, o, em, ens são acentuadas; paroxítonas terminadas em i, us, um, uns, l, n, r, x, ã, ãs, ão, ãos, ps são acentuadas; proparoxítonas são todas acentuadas. O Acordo de 1990 eliminou o trema e alguns acentos diferenciais.",
["Oxítonas, paroxítonas, proparoxítonas","Regras por terminação","Trema abolido","Acento diferencial reduzido"],
"'Ideia' e 'assembleia' não têm mais acento. 'Pôde' (passado) mantém; 'pode' (presente) não.",
"Texto de autoria própria: “Ele ______ ontem, mas hoje não ______ mais.”",
"Preenchem corretamente:",
["pode / pôde","pôde / pode","pôde / pôde","pode / pode","pôde / pôdi"],
1,"'Pôde' (pretérito) leva acento; 'pode' (presente) não. A sequência correta é 'pôde' / 'pode'. As demais trocam os tempos ou inventam formas."
],
"Hífen":[
"O hífen é usado em palavras compostas, em prefixos com hífen obrigatório (ex-, vice-, sem-, além-, aquém-, recém-), em compostos com 'bem' e 'mal' quando formam unidade de sentido, e em encadeamentos vocabulares. O Acordo de 1990 fixou novas regras.",
["Prefixos com hífen: ex-, vice-, sem-","Compostos com 'bem' e 'mal'","Encadeamentos: ponte Rio-Niterói","Regras do Acordo de 1990"],
"'Ex-presidente' tem hífen; 'excepcional' não. 'Bem-vindo' tem hífen; 'benfeitor' não.",
"Texto de autoria própria: “O ______ presidente participou da ______-feira.”",
"Preenchem corretamente:",
["ex / feira","ex- / feira","ex- / feira","ex / feira","ex- / feira"],
1,"'Ex-presidente' leva hífen (prefixo ex-). 'Feira' não leva hífen quando isolada. A forma correta é 'ex-' e 'feira' sem hífen."
],
"Relações de sentido entre palavras":[
"Sinônimos têm sentidos próximos (casa/moradia). Antônimos, sentidos opostos (alto/baixo). Homônimos têm mesma forma e sentidos diferentes (cela/sela, mas com grafias distintas — homófonos). Parônimos são parecidos na forma, mas diferentes no sentido (concerto/conserto). O contexto define qual usar.",
["Sinônimos: sentidos próximos","Antônimos: sentidos opostos","Homônimos: mesma forma (ou som)","Parônimos: parecidos, sentidos diferentes"],
"'Concerto' é apresentação musical; 'conserto' é reparo. 'Cela' é cubículo; 'sela' é cavalgar. O contexto ajuda a distinguir.",
"Texto de autoria própria: “Ele ______ a bicicleta antes da ______ da orquestra.”",
"Preenchem corretamente:",
["concerto / conserto","consertou / concerto","conserto / concerto","concertou / conserto","concerto / concerto"],
1,"'Consertou' (verbo consertar, reparar) e 'concerto' (apresentação musical) são parônimos com sentidos distintos. As demais combinações trocam as formas."
],
"Acordo Ortográfico de 1990":[
"O Acordo Ortográfico de 1990, em vigor no Brasil desde 2009, unificou a ortografia do português nos países lusófonos. Principais mudanças: fim do trema ('linguiça', não 'lingüiça'); perda do acento diferencial em 'pára' (verbo), 'pêlo' (substantivo) etc.; 'ideia', 'assembleia' sem acento; 'voo', 'enjoo' sem acento; 'frequente' mantém 'qu' sem trema.",
["Fim do trema","'Ideia', 'assembleia', 'heroico' sem acento","'Voo', 'enjoo', 'creem' sem acento","'Pára' (verbo) perde acento"],
"Cuidado: 'pôr' (verbo) mantém o acento diferencial; 'pode' (presente) e 'pôde' (passado) mantêm. 'Pôr' se distingue de 'por' (preposição).",
"Texto de autoria própria: “Ele ______ o livro na estante e disse que ______ vir amanhã.”",
"Preenchem corretamente:",
["pôs / pode","pôs / pôde","pós / pôde","pôs / pôdi","pois / pôde"],
1,"'Pôs' (verbo pôr no pretérito) leva acento. 'Pôde' (verbo poder no passado) também. As demais formas estão incorretas."
],
"Letra e fonema":[
"Letra é a representação gráfica do som; fonema é a menor unidade sonora da língua. Nem sempre há correspondência exata: uma letra pode representar vários fonemas (a letra 'x' em 'xícara', 'exame', 'máximo') e um fonema pode ser representado por várias letras ('ss', 's', 'ç', 'x' com som de /s/). Os encontros consonantais e dígrafos também são estudados aqui.",
["Letra ≠ fonema","Uma letra pode ter vários sons","Um som pode ter várias letras","Dígrafos: duas letras, um som"],
"'Ch' em 'chave' é dígrafo: duas letras, um fonema. 'X' em 'táxi' tem som de /ks/.",
"Texto de autoria própria: “O ______ da questão estava no ______ do problema.”",
"Preenchem corretamente, considerando o contexto:",
["x / x","s / ss","ç / s","x / ch","z / s"],
1,"A questão pede a grafia correta: 'O cerne da questão' (com 'c') e 'o âmago do problema' (com 'g'). As alternativas testam a confusão entre letras e sons, mas a grafia correta exige o conhecimento das palavras."
],
"Adequação vocabular":[
"A adequação vocabular consiste em escolher a palavra certa para o contexto, considerando o registro (formal/informal), o interlocutor e a situação comunicativa. Palavras sinônimas podem ter nuances de sentido diferentes ('casa' e 'lar' têm conotações distintas). O ENEM cobra essa adequação em textos que exigem precisão lexical.",
["Escolha lexical depende do contexto","Registro formal × informal","Sinônimos têm nuances diferentes","Precisão vocabular"],
"'Moradia' é mais formal que 'casa'. 'Falecer' é mais solene que 'morrer'. A escolha depende da situação.",
"Texto de autoria própria: “No relatório técnico, o engenheiro escreveu: 'A estrutura está ______ e precisa de reparos urgentes.'”",
"A palavra mais adequada ao registro formal é:",
["meio capenga","torta","danificada","meio zoada","arrepiada"],
2,"Em um relatório técnico, o registro é formal. 'Danificada' é a opção adequada. 'Meio capenga', 'torta', 'meio zoada' e 'arrepiada' são informais ou inadequadas ao contexto."
],
"Citação, alusão e epígrafe":[
"Citação é a reprodução literal de um trecho, com indicação de autor e obra. Alusão é a referência indireta, sem reprodução literal. Epígrafe é a citação que abre uma obra ou capítulo, como chave de leitura. Todas são formas de intertextualidade.",
["Citação: reprodução literal","Alusão: referência indireta","Epígrafe: citação de abertura","Todas são intertextuais"],
"Citação é direta (aspas, autor, obra). Alusão é indireta, exige do leitor o conhecimento prévio.",
"Texto de autoria própria: “O romance abre com uma epígrafe de Machado de Assis: 'Ao vencedor, as batatas!'. Ao longo da narrativa, o narrador alude à 'Canção do Exílio', sem citá-la literalmente.”",
"No trecho, identifica-se, respectivamente, epígrafe e:",
["Citação direta.","Paráfrase.","Alusão.","Plágio.","Paródia."],
2,"A referência sem citação literal à 'Canção do Exílio' é alusão. Epígrafe é a citação de abertura. Não há paráfrase (B), plágio (D) nem paródia (E) necessariamente."
],
"Paráfrase":[
"Paráfrase é a reescritura de um texto com outras palavras, mantendo o sentido essencial. Não confunda com paródia (que subverte o sentido, com efeito crítico ou humorístico) nem com plágio (que copia sem crédito). A paráfrase exige fidelidade ao conteúdo.",
["Reescritura com outras palavras","Mantém o sentido","Paráfrase ≠ paródia ≠ plágio","Exige fidelidade"],
"A paráfrase respeita o original; a paródia o subverte. Identifique a intenção.",
"Texto original (adaptado): “O tempo é senhor de tudo: apaga mágoas, cura feridas e desfaz ilusões.” Paráfrase proposta: “Todas as coisas se submetem ao tempo, que atenua dores, sara feridas e desfaz enganos.”",
"A paráfrase:",
["Mantém o sentido essencial do texto original, com outras palavras.","Subverte o sentido original, com humor.","Copia literalmente o texto.","Introduz informação nova não presente no original.","Nega o texto original."],
0,"A paráfrase reformula o original mantendo o sentido. Não é paródia (B), cópia (C), acréscimo (D) nem negação (E)."
],
"Paródia e estilização":[
"Paródia é a retomada de um texto com subversão do sentido, geralmente com efeito crítico ou humorístico. Estilização é a retomada do estilo de um autor ou movimento, sem subverter o sentido. Ambas são formas de intertextualidade, mas com intenções diferentes.",
["Paródia: subverte o sentido","Estilização: imita o estilo","Paródia critica; estilização homenageia","Ambas retomam o texto-fonte"],
"Paródia = subversão. Estilização = homenagem formal. Se há crítica, é paródia.",
"Texto original: 'Minha terra tem palmeiras, / Onde canta o Sabiá'. Paródia: 'Minha terra tem palmeiras, / Onde o asfalto cobriu tudo'.",
"O segundo texto é:",
["Cópia do original.","Paráfrase do original.","Paródia: retoma o original e subverte o sentido, com crítica à urbanização.","Estilização sem subversão.","Alusão apenas."],
2,"A retomada de 'Canção do Exílio' com inversão crítica (asfalto cobriu) caracteriza paródia. Não é cópia (A), paráfrase (B), estilização neutra (D) nem mera alusão (E)."
],
"Discurso direto, indireto e polifonia":[
"Discurso direto reproduz a fala do personagem entre aspas ou travessões. Discurso indireto a transpõe para a voz do narrador. Discurso indireto livre mistura as duas vozes, sem marcas explícitas. Polifonia é a presença de várias vozes no texto, como em romances e textos argumentativos que dão lugar a diferentes perspectivas.",
["Direto: fala entre aspas ou travessões","Indireto: narrador transpõe","Indireto livre: vozes se fundem","Polifonia: várias vozes"],
"Discurso direto: marcas explícitas (aspas, travessões). Indireto livre: o leitor percebe o pensamento do personagem sem marcadores.",
"Texto de autoria própria: “João pensou: 'Não vou desistir'. Mais tarde, disse ao amigo que não desistiria. Aquela teimosia, porém, era dele, do narrador, do leitor, de todos os teimosos do mundo.”",
"Há, no trecho, respectivamente:",
["Discurso direto, indireto e indireto livre.","Discurso indireto apenas.","Discurso direto apenas.","Discurso indireto livre apenas.","Nenhum tipo de discurso."],
0,"'Não vou desistir' é discurso direto; 'disse ao amigo que não desistiria' é indireto; 'Aquela teimosia... de todos os teimosos' mistura vozes, configurando indireto livre. As demais alternativas reduzem o trecho a um só tipo."
],
"Verbal, não verbal e multimodal":[
"Linguagem verbal usa palavras; não verbal usa imagens, sons, gestos, cores. Multimodalidade é a combinação das duas (ou mais) em um mesmo texto: charges, tirinhas, anúncios, infográficos, vídeos. Nos textos multimodais, o sentido emerge da articulação entre as linguagens.",
["Verbal: palavra","Não verbal: imagem, som, gesto","Multimodal: combina linguagens","Sentido emerge da articulação"],
"Em uma charge, a crítica pode estar só na imagem, só no texto ou na combinação. Leia sempre os dois.",
"Descrição de anúncio (adaptado): Sobre a foto de um rio poluído, lê-se: “Um brinde ao futuro.”",
"O anúncio é multimodal porque:",
["Usa apenas palavras.","Usa apenas imagens.","Combina imagem (rio poluído) e texto verbal ('um brinde ao futuro'), gerando crítica pela ironia entre eles.","É composto por sons.","É um texto apenas argumentativo."],
2,"A imagem (poluição) e o texto ('um brinde ao futuro') produzem sentido conjunto, por contraste irônico. Não é só verbal (A) nem só visual (B), nem sonoro (D) nem só argumentativo (E)."
],
"Leitura de charges e tirinhas":[
"Charges e tirinhas combinam imagem e texto e exigem leitura em camadas: contexto histórico, personagens, crítica, humor. A charge tende à crítica política ou social atual; a tirinha, ao humor cotidiano com personagens fixos. Reconhecer a quebra de expectativa é essencial.",
["Charge: crítica atual","Tirinha: humor cotidiano","Leitura: imagem + texto + contexto","Quebra de expectativa = humor"],
"Sem contexto, a charge perde sentido. Identifique o fato do momento representado.",
"Descrição de charge (adaptada): Um político discursa em um pódio; ao fundo, um cartaz diz 'Mais educação'. Nos pés do pódio, uma placa caída: 'Cortes na educação'.",
"A crítica da charge se constrói:",
["Pela informação verídica que ela apresenta.","Pelo contraste entre o discurso do político e a realidade denunciada pelos elementos visuais.","Pelo elogio à gestão pública.","Pela defesa de aumento de impostos.","Pela ausência de ironia."],
1,"O contraste entre o cartaz de campanha e a placa de cortes denuncia a contradição. É crítica social. Não é elogio (C), nem defesa tributária (D), nem ausência de ironia (E)."
],
"Infográficos, gráficos e tabelas":[
"Infográficos, gráficos e tabelas organizam dados para facilitar a leitura. Gráficos de barras comparam categorias; de linhas, mostram evolução; de pizza, proporções. Tabelas cruzam variáveis. A leitura exige identificar título, fonte, eixos, unidades e a mensagem central.",
["Título, fonte, eixos","Barras: categorias","Linhas: evolução","Pizza: proporções","Tabela: cruza dados"],
"Antes de interpretar, leia título, eixos e unidades. Muitos erros vêm da leitura apressada.",
"Descrição de gráfico (adaptado, dados fictícios): Gráfico de linhas mostra queda do analfabetismo no Brasil entre 2000 e 2020, com inclinação mais acentuada entre 2000 e 2010.",
"Sobre o gráfico, é correto afirmar:",
["O analfabetismo aumentou no período.","O analfabetismo caiu, com queda mais acentuada entre 2000 e 2010.","O gráfico mostra dados de vários países.","O gráfico trata de analfabetismo funcional apenas.","O gráfico mostra estabilidade total no período."],
1,"A leitura do gráfico de linhas mostra queda do analfabetismo, com maior inclinação em 2000-2010. As demais alternativas contradizem a descrição."
],
"Linguagem corporal":[
"A linguagem corporal é um sistema de comunicação não verbal que inclui gestos, postura, expressões faciais, olhar e distância entre interlocutores. Complementa, contradiz ou substitui a linguagem verbal. No ENEM, pode aparecer em questões sobre comunicação, diversidade cultural e arte.",
["Gestos, postura, olhar","Complementa ou substitui a fala","Varia entre culturas","Não verbal"],
"Um gesto pode ter significados diferentes em culturas distintas. Não julgue como universal.",
"Texto de autoria própria (adaptado): “Em algumas culturas, olhar nos olhos do interlocutor demonstra sinceridade; em outras, é sinal de desrespeito. O corpo fala, mas seu idioma varia.”",
"O trecho trata de:",
["Linguagem verbal.","Linguagem corporal e sua variação cultural.","Língua estrangeira.","Gramática normativa.","Literatura."],
1,"O texto discute gestos e olhar (linguagem corporal) e sua variação entre culturas. Não é linguagem verbal (A), língua estrangeira (C), gramática (D) nem literatura (E)."
],
"Artes visuais e leitura de imagem":[
"A leitura de imagens (pinturas, fotografias, esculturas, grafismos) exige analisar elementos como cor, forma, luz, composição, perspectiva e contexto. No ENEM, imagens são usadas para interpretação, frequentemente combinadas com textos verbais (multimodalidade).",
["Cor, forma, luz, composição","Contexto histórico","Leitura multimodal","Arte como documento"],
"Antes de interpretar, descreva o que vê: quem, o quê, onde, cores, expressões. Depois, relacione ao contexto.",
"Descrição de obra (adaptada): Um quadro mostra uma família à mesa, mas os pratos estão vazios e as expressões são tensas. As cores são escuras, e há uma janela com grades.",
"Qual leitura é mais coerente?",
["A obra celebra a união familiar.","A obra sugere escassez e aprisionamento, pelas cores escuras, pratos vazios e grades.","A obra retrata uma festa.","A obra é apenas decorativa, sem sentido.","A obra retrata abundância."],
1,"Os elementos visuais (pratos vazios, expressões tensas, grades, cores escuras) constroem um sentido de escassez e opressão. Não há celebração (A), festa (C), neutralidade (D) nem abundância (E)."
],
"Tese e tipos de argumento":[
"Tese é a ideia central defendida em um texto argumentativo. Argumentos sustentam a tese: de autoridade (cita especialista), por exemplos (casos concretos), por dados (estatísticas), por comparação, por causa e consequência. Reconhecer o tipo de argumento ajuda a avaliar a solidez do texto.",
["Tese: ideia defendida","Argumento de autoridade","Argumento por exemplos e dados","Argumento por causa-consequência"],
"Identifique primeiro a tese; depois, classifique cada argumento. O ENEM cobra muito a distinção entre fato, opinião e argumento.",
"Texto de autoria própria: “O uso excessivo de telas prejudica o sono dos adolescentes. Segundo a Sociedade Brasileira de Pediatria, a luz azul atrasa a produção de melatonina. Além disso, pesquisas mostram que jovens que usam o celular antes de dormir relatam mais insônia.”",
"Os argumentos usados são, respectivamente, de:",
["Exemplo e causa.","Autoridade e dados.","Causa e consequência.","Comparação e exemplo.","Autoridade e comparação."],
1,"'Segundo a Sociedade Brasileira de Pediatria' é argumento de autoridade; 'pesquisas mostram' é argumento por dados. As demais opções não correspondem à classificação."
],
"Argumento de autoridade":[
"O argumento de autoridade apoia-se na credibilidade de uma fonte: especialista, instituição, pesquisa reconhecida, obra clássica. É forte quando a autoridade é legítima no tema e quando a citação é bem integrada ao raciocínio.",
["Fonte credenciada","Especialista ou instituição","Citação integrada","Não basta citar: é preciso explicar"],
"Não confunda 'fulano disse' (falácia de autoridade) com argumento de autoridade legítimo, quando a fonte é competente no assunto.",
"Texto de autoria própria: “Segundo a Organização Mundial da Saúde, a poluição do ar causa milhões de mortes prematuras por ano. O dado evidencia a urgência de políticas ambientais.”",
"O argumento é de:",
["Exemplo.","Autoridade.","Causa e consequência.","Comparação.","Falácia."],
1,"A OMS é instituição reconhecida no tema: argumento de autoridade. Não é exemplo (A), causa/consequência (C), comparação (D) nem falácia (E)."
],
"Argumento por causa e consequência":[
"O argumento por causa e consequência estabelece uma relação causal entre fatos: se X ocorre, Y decorre. É muito usado em textos científicos e jornalísticos, mas exige cuidado para não confundir correlação com causalidade.",
["Relação causa → efeito","Cuidado com correlação ≠ causalidade","Comum em textos científicos","Pode ser refutado"],
"'O aumento do desmatamento provocou a queda da biodiversidade' é causa-consequência. 'Choveu e o time perdeu' pode ser mera coincidência.",
"Texto de autoria própria: “A falta de saneamento básico aumenta a incidência de doenças. Por isso, investir em esgoto é investir em saúde.”",
"O argumento é de:",
["Autoridade.","Exemplo.","Causa e consequência.","Comparação.","Falácia."],
2,"A relação 'falta de saneamento → aumento de doenças' é causal. Trata-se de argumento por causa e consequência. Não é autoridade (A), exemplo (B), comparação (D) nem falácia (E)."
],
"Contra-argumento e falácias":[
"Contra-argumento é a objeção à tese ou a um argumento, que pode ser refutada. Falácia é um raciocínio inválido que parece correto: generalização apressada, apelo à emoção, ataque à pessoa (ad hominem), falsa causa, falsa dicotomia. Reconhecer falácias é fundamental para uma leitura crítica.",
["Contra-argumento: objeção","Falácia: raciocínio inválido","Ad hominem: ataque à pessoa","Falsa dicotomia: só duas opções","Generalização apressada"],
"Nem todo argumento forte é válido: verifique se a conclusão decorre das premissas.",
"Texto de autoria própria: “Não se pode confiar nas pesquisas desse cientista sobre vacinas: afinal, ele é muito vaidoso.”",
"O argumento é falacioso porque:",
["Apresenta dados verificáveis.","Ataca a pessoa, não o argumento (ad hominem).","Usa argumento de autoridade.","Apresenta contra-argumento válido.","Apela à compaixão."],
1,"A vaidade do cientista não tem relação com a validade das pesquisas. É falácia ad hominem. Não há dados (A), autoridade (C), contra-argumento (D) nem apelo à compaixão (E)."
],
"Ethos, pathos e logos":[
"Ethos, pathos e logos são as três dimensões da persuasão, segundo Aristóteles. Ethos: credibilidade do orador. Pathos: apelo às emoções do público. Logos: apelo à razão, por meio de dados e argumentos. Os três operam simultaneamente, com pesos variáveis.",
["Ethos: credibilidade","Pathos: emoção","Logos: razão, dados","Combinam-se"],
"Se o texto emociona, é pathos. Se convence pela lógica e dados, é logos. Se valoriza o caráter do orador, é ethos.",
"Texto de autoria própria: “Como médico com 30 anos de experiência em pediatria, afirmo: as vacinas salvam vidas. Os dados oficiais comprovam a queda da mortalidade infantil onde a cobertura vacinal é alta.”",
"Identificam-se, respectivamente:",
["Logos, pathos e ethos.","Ethos, logos e pathos.","Ethos, pathos e logos.","Ethos e logos.","Pathos apenas."],
3,"A credibilidade do médico (ethos) aparece na primeira parte; os dados oficiais configuram logos. Não há apelo direto à emoção (pathos) no trecho."
],
"Modalizadores":[
"Modalizadores são palavras ou expressões que revelam a atitude do falante em relação ao que diz: certeza ('é evidente que'), dúvida ('talvez'), obrigação ('é preciso'), avaliação ('felizmente'). São marcas da subjetividade e orientam a interpretação do leitor.",
["Certeza: 'é evidente que'","Dúvida: 'talvez'","Obrigação: 'é preciso'","Avaliação: 'felizmente'"],
"Reconheça o modalizador para identificar a atitude do autor: certeza, dúvida, apreciação.",
"Texto de autoria própria: “É evidente que a educação deve ser prioridade. Talvez, porém, falte vontade política.”",
"Os modalizadores 'é evidente' e 'talvez' expressam, respectivamente:",
["Dúvida e certeza.","Certeza e dúvida.","Obrigação e avaliação.","Avaliação e obrigação.","Certeza e obrigação."],
1,"'É evidente' marca certeza; 'talvez' marca dúvida. As demais combinações trocam os valores."
],
"Hipertexto e gêneros digitais":[
"Hipertexto é o texto digital que se ramifica por links, permitindo múltiplos percursos de leitura. Gêneros digitais surgem nesse ambiente: e-mail, post, meme, tweet, stories, comentário. A leitura em tela é não linear, colaborativa e multimodal.",
["Hipertexto: links, leitura não linear","Gêneros digitais: e-mail, post, meme","Multimodalidade e colaboração","Leitura em tela ≠ leitura impressa"],
"O hipertexto não tem leitura única: cada leitor constrói seu percurso. Isso não significa ausência de autor, mas nova forma de organização.",
"Texto de autoria própria: “Ao ler uma notícia na internet, o leitor pode clicar em links, assistir a vídeos, conferir dados em outras páginas e voltar. A leitura deixa de ser linear e passa a ser uma construção.”",
"O trecho trata de:",
["Leitura linear de romance impresso.","Hipertexto e leitura não linear na internet.","Produção de texto argumentativo escolar.","Rádio e televisão apenas.","Jornal impresso do século XX."],
1,"A possibilidade de clicar em links, assistir a vídeos e construir percursos caracteriza o hipertexto. Não é leitura linear (A) nem produção escolar (C), rádio (D) nem jornal impresso (E)."
],
"Memes e redes sociais":[
"Memes são unidades culturais que se propagam pela internet, geralmente com humor e crítica, combinando imagem e texto. Nas redes sociais, a linguagem é marcada por informalidade, hashtags, emojis, abreviações e interação rápida. A leitura exige reconhecer ironia, polissemia e referências culturais.",
["Meme: humor, crítica, propagação","Redes sociais: informalidade","Hashtags, emojis, abreviações","Leitura depende do repertório"],
"Memes não são só humor: podem fazer crítica social e política. Identifique a referência.",
"Texto de autoria própria (adaptado): Meme com imagem de um gato digitando e a legenda: “eu, fingindo que entendo a explicação do professor”.",
"O efeito de humor do meme se apoia:",
["Na fofura do gato.","Na identificação do leitor com a situação representada (fingir entender algo).","Na informação objetiva.","Na crítica a professores.","No uso de linguagem formal."],
1,"O humor vem da identificação do usuário com a cena (fingir entender). Não é fofura (A), informação (C), crítica aos professores (D) nem linguagem formal (E)."
],
"Fake news e checagem de informação":[
"Fake news são informações falsas ou distorcidas que circulam, sobretudo em redes sociais, com aparência de notícia. Combatê-las exige checar fonte, data, autor, contexto e buscar a informação em veículos confiáveis. A leitura crítica de textos digitais é uma habilidade essencial do letramento contemporâneo.",
["Informação falsa com aparência de notícia","Checar fonte, data, autor, contexto","Aparência de credibilidade","Letramento digital crítico"],
"Desconfie de manchetes sensacionalistas, ausência de autoria, erros de português e apelos emocionais. Cheque antes de compartilhar.",
"Texto de autoria própria (adaptado): “Uma mensagem viral afirma que 'um novo estudo comprova que comer X emagrece 10 kg em uma semana'. O texto não cita autores, revista nem instituição. A imagem é de banco de imagens.”",
"O sinal que mais indica que a mensagem pode ser fake news é:",
["Uso de linguagem popular.","Ausência de fonte verificável (autores, revista, instituição).","Presença de imagem.","Uso de maiúsculas.","Menção a 'estudo'."],
1,"A ausência de fonte verificável é um dos principais indicadores de fake news. Os demais itens são comuns em textos legítimos e não indicam falsidade por si."
],
"Letramento digital":[
"O letramento digital é a capacidade de usar criticamente as tecnologias digitais para ler, escrever, buscar, avaliar e produzir informações. Envolve não só habilidades técnicas, mas também ética, segurança e pensamento crítico diante de conteúdos online.",
["Uso crítico da tecnologia","Busca, avaliação e produção","Ética e segurança","Não é só saber usar aparelhos"],
"Um letrado digital sabe distinguir fonte confiável de fake news, proteger dados e participar de forma ética nas redes.",
"Texto de autoria própria: “Não basta saber usar o celular: é preciso avaliar a credibilidade das informações, respeitar a privacidade alheia e produzir conteúdo com responsabilidade. Isso é letramento digital.”",
"O trecho define:",
["Alfabetização.","Letramento digital.","Letramento literário.","Gramática normativa.","Fluência verbal."],
1,"O texto descreve o uso crítico, ético e produtivo das tecnologias digitais: letramento digital. Não é alfabetização (A), letramento literário (C), gramática (D) nem fluência verbal (E)."
],
"As cinco competências":[
"A redação do ENEM é avaliada em cinco competências, cada uma valendo 200 pontos (total 1 000): (1) domínio da norma-padrão; (2) compreensão do tema e não tangenciamento; (3) seleção e organização de argumentos; (4) coesão e coerência; (5) proposta de intervenção. Cada uma tem critérios próprios.",
["C1: norma-padrão","C2: tema e repertório","C3: argumentação","C4: coesão e coerência","C5: proposta de intervenção"],
"Zerar qualquer competência não zera a redação, mas compromete muito a nota. Fuga ao tema, no entanto, zera a redação inteira.",
"Texto de autoria própria (adaptado): “A prova de redação do ENEM avalia cinco competências, cada uma valendo 200 pontos. A competência 1 verifica o domínio da norma-padrão; a 5, a proposta de intervenção com cinco elementos.”",
"Sobre as cinco competências, é correto afirmar:",
["São três competências.","São cinco competências, cada uma valendo 200 pontos, totalizando 1 000.","Cada competência vale 100 pontos.","Apenas a competência 1 importa.","A redação é avaliada por uma única competência."],
1,"São cinco competências, 200 pontos cada, total 1 000. As demais alternativas erram o número, a pontuação ou a estrutura."
],
"Competência 1: norma-padrão":[
"A Competência 1 da redação do ENEM avalia o domínio da modalidade escrita formal da língua portuguesa: ortografia, acentuação, pontuação, concordância, regência, crase, colocação pronominal. Desvios recorrentes reduzem a nota.",
["Ortografia e acentuação","Concordância e regência","Pontuação","Crase e colocação pronominal"],
"Releia a redação procurando especificamente erros de norma-padrão. Uma revisão focada evita perda de pontos.",
"Texto de autoria própria (adaptado): “A competência 1 avalia o domínio da norma-padrão. Erros de concordância, pontuação e ortografia são desvios que comprometem a nota.”",
"Sobre a Competência 1, é correto afirmar:",
["Avalia apenas o conteúdo.","Avalia o domínio da norma-padrão escrita.","Avalia a proposta de intervenção.","Avalia a coesão.","Avalia a argumentação."],
1,"A Competência 1 é específica para o domínio da norma-padrão escrita. As demais competências cuidam de conteúdo (2), argumentação (3), coesão (4) e proposta (5)."
],
"Competência 2: tema e repertório":[
"A Competência 2 avalia a compreensão do tema e a mobilização de repertório sociocultural. O candidato não pode fugir do tema nem tangenciá-lo; precisa abordá-lo integralmente e usar conhecimentos externos de forma produtiva.",
["Compreensão do tema","Não fugir nem tangenciar","Repertório produtivo","Tipo dissertativo-argumentativo"],
"Tangenciar é abordar o tema de forma superficial ou parcial. Fuga total zera a redação; tangenciamento reduz muito a nota.",
"Texto de autoria própria (adaptado): “A competência 2 exige que o candidato compreenda o tema e mobilize repertório sociocultural, sem fugir nem tangenciar.”",
"Sobre a Competência 2, é correto afirmar:",
["Avalia apenas a norma-padrão.","Avalia a compreensão do tema e o repertório.","Avalia a proposta de intervenção.","Avalia a pontuação.","Avalia a coesão."],
1,"A Competência 2 trata do tema e do repertório. As demais competências cuidam de norma (1), argumentação (3), coesão (4) e proposta (5)."
],
"Competência 3: argumentação":[
"A Competência 3 avalia a seleção, organização e interpretação de informações, fatos, opiniões e argumentos em defesa de um ponto de vista. O texto precisa ter tese clara, argumentos consistentes e progressão.",
["Tese clara","Argumentos consistentes","Progressão","Defesa de ponto de vista"],
"Cada parágrafo de desenvolvimento deve defender um argumento com repertório e análise. Não basta listar ideias.",
"Texto de autoria própria (adaptado): “A competência 3 avalia a capacidade de selecionar, organizar e interpretar argumentos em defesa de um ponto de vista.”",
"Sobre a Competência 3, é correto afirmar:",
["Avalia a norma-padrão.","Avalia a argumentação e a defesa de ponto de vista.","Avalia a proposta de intervenção.","Avalia a ortografia.","Avalia apenas a conclusão."],
1,"A Competência 3 é sobre argumentação. As demais competências tratam de norma (1), tema (2), coesão (4) e proposta (5)."
],
"Competência 4: coesão e coerência":[
"A Competência 4 avalia o uso de mecanismos linguísticos de coesão e a coerência textual. Isso inclui conectivos, pronomes, repetições controladas, progressão temática, não contradição e adequação ao gênero.",
["Conectivos adequados","Retomadas pronominais","Progressão temática","Não contradição"],
"Um texto pode ter coesão e ser incoerente. A competência 4 avalia as duas dimensões em conjunto.",
"Texto de autoria própria (adaptado): “A competência 4 avalia a coesão (mecanismos linguísticos) e a coerência (sentido global) do texto.”",
"Sobre a Competência 4, é correto afirmar:",
["Avalia apenas a norma-padrão.","Avalia coesão e coerência.","Avalia a proposta.","Avalia o repertório.","Avalia a argumentação."],
1,"A Competência 4 avalia coesão e coerência. As demais competências cuidam de norma (1), tema (2), argumentação (3) e proposta (5)."
],
"Competência 5: proposta de intervenção":[
"A Competência 5 avalia a proposta de intervenção: precisa conter agente, ação, modo/meio, finalidade e detalhamento. Deve ser articulada ao tema e à discussão desenvolvida no texto, respeitando os direitos humanos.",
