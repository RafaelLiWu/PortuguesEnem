"Tema é o assunto geral do texto; ideia central é o que o autor afirma sobre esse tema. Enquanto o tema pode ser resumido em poucas palavras (por exemplo, 'redes sociais'), a ideia central traz uma posição: 'as redes sociais aproximam pessoas distantes, mas enfraquecem laços presenciais'. No ENEM, identificar a ideia central exige distinguir o que é apenas pano de fundo do que é a mensagem principal.",

"A pergunta clássica é 'qual é o tema?' ou 'qual a ideia defendida?'. Tema raramente é resposta: prefira a alternativa que traz uma afirmação sobre o assunto.",
"Texto de autoria própria, adaptado para fins didáticos: “Vivemos cercados de telas. Elas nos conectam a pessoas distantes, mas também nos isolam de quem está ao lado. O celular na mesa do restaurante, ainda que desligado, já modifica a conversa: cada um sabe que pode ser interrompido a qualquer momento. A questão, portanto, não é demonizar a tecnologia, e sim perguntar quanto de presença ela nos custa.”",
"Qual é a ideia central do texto?",
["A tecnologia deve ser abandonada em restaurantes.","O celular é o principal inimigo das relações humanas.","A tecnologia conecta e isola ao mesmo tempo, e o autor propõe avaliar o preço dessa presença.","Restaurantes deveriam proibir o uso de celulares.","As conversas presenciais sempre foram melhores que as digitais."],
2,"A ideia central articula os dois polos apresentados (conexão × isolamento) e a proposta final do autor ('perguntar quanto de presença ela nos custa'). As demais alternativas trazem posições radicais (A, B, D) que o texto não assume, ou uma generalização romântica (E). Tema seria apenas 'tecnologia e relações humanas'."
],
"Inferência e pressupostos":[
"Inferência é concluir algo que não está dito explicitamente, mas que decorre do texto. Pressuposto é a informação que o enunciado toma como já sabida (por marcas linguísticas como 'ainda', 'já', 'também'). Subentendido é o que se insinua sem se comprometer. O ENEM cobra inferências ancoradas em pistas textuais, nunca em opinião pessoal.",
["Inferir = deduzir a partir de pistas","Pressuposto: informação implícita marcada por palavras","Subentendido: insinuação sem marca explícita","Inferência ≠ adivinhação"],
"Nunca responda 'com base na sua experiência'. Toda inferência válida tem de estar apoiada em uma marca do texto.",
"Texto de autoria própria: “Quando cheguei à reunião, todos já estavam sentados. Minha cadeira, a única vazia, ficava no canto mais distante da mesa. O chefe ergueu os olhos, olhou o relógio e continuou a falar.”",
"O que se pode inferir sobre o narrador?",
["Que chegou atrasado e foi, de algum modo, preterido na disposição do espaço.","Que era o líder da reunião.","Que ninguém o conhecia na sala.","Que estava doente e não pôde comparecer.","Que o chefe o elogiaria em seguida."],
0,"As marcas 'já estavam sentados', 'única vazia', 'canto mais distante' e o gesto do chefe (olhar o relógio) sustentam a inferência de atraso e certo desprestígio. As alternativas B e C não têm apoio no texto; D contradiz o próprio 'cheguei'; E é especulação sem pista."
],
"Ironia e humor no texto":[
"Ironia é dizer o contrário do que se pensa, contando com a cumplicidade do leitor. O humor pode vir da quebra de expectativa, do exagero, do duplo sentido ou da crítica social. No ENEM, identificar ironia exige atenção ao contexto e ao contraste entre o que se diz e o que se sabe ser verdadeiro.",
["Ironia: sentido figurado contrário ao literal","Humor: quebra de expectativa ou crítica","Contexto é decisivo","Não leia ironia como afirmação literal"],
"Se a frase elogia algo que o texto antes criticou, é ironia. Se o texto parece afirmar algo absurdo, provavelmente está zombando.",
"Texto de autoria própria, adaptado para fins didáticos (crônica): “Como é maravilhoso morar em uma cidade que investe tanto em transporte público! Basta esperar quarenta minutos na parada, em pé, no sol, para ver passar o ônibus lotado. É um privilégio raro, que poucos países oferecem.”",
"O efeito de sentido produzido no trecho é de:",
["Elogio sincero ao transporte público.","Descrição objetiva e neutra do sistema de ônibus.","Ironia, pois o autor critica o serviço usando palavras aparentemente elogiosas.","Nostalgia em relação a um sistema que já foi bom.","Defesa do uso de carros particulares como alternativa."],
2,"As expressões 'maravilhoso', 'investe tanto' e 'privilégio raro' contrastam com as marcas negativas ('quarenta minutos', 'em pé', 'no sol', 'lotado'). Trata-se de ironia: elogia-se para criticar. A alternativa A lê literalmente; B ignora o juízo de valor; D e E extrapolam o texto."
],
"Intenção do autor e propósito":[
"Todo texto é escrito com um propósito: informar, convencer, emocionar, divertir, instruir, vender, criticar. Reconhecer a intenção exige observar o gênero, o suporte, o público-alvo e as escolhas linguísticas. No ENEM, o enunciado costuma perguntar 'qual a finalidade do texto?'.",
["Informar, persuadir, instruir, divertir, emocionar","Gênero e suporte ajudam a revelar a intenção","Público-alvo orienta as escolhas"],
"Pergunte: 'para quê e para quem esse texto foi feito?'. Reportagem informa; anúncio vende; editorial opina; manual instrui.",
"Texto de autoria própria (adaptado, com dados fictícios, para fins didáticos): “ATENÇÃO, MOTORISTA: a partir de 1º de março, o rodízio passa a valer também aos sábados, das 8h às 14h. Consulte a placa do seu veículo e evite multas. Informações: site da Prefeitura.”",
"O texto tem como principal finalidade:",
["Narrar um acontecimento recente.","Defender uma opinião sobre mobilidade urbana.","Informar o motorista sobre mudança de regra e orientá-lo a agir.","Divertir o leitor com uma situação cotidiana.","Promover a venda de um produto automotivo."],
2,"O texto é uma comunicação oficial, em tom imperativo ('consulte', 'evite'), cujo objetivo é informar a nova regra e orientar o motorista. Não há narração (A), defesa de opinião (B), humor (D) nem venda (E)."
],
"Vocabulário no contexto":[
"O sentido de uma palavra depende do contexto. Denotação é o sentido literal, dicionarizado; conotação é o sentido figurado, afetivo, situacional. Em 'vou cortar o cabelo' e 'vou cortar o orçamento', 'cortar' tem sentidos diferentes. O ENEM cobra essa leitura pela substituição ou pelo efeito de sentido.",
["Denotação: sentido literal","Conotação: sentido figurado","Uma palavra pode ter vários sentidos (polissemia)","O contexto decide o sentido"],
"Desconfie da 'palavra difícil': a pergunta quase sempre quer o sentido no texto, não no dicionário isolado.",
"Texto de autoria própria: “A notícia caiu como uma bomba na redação: o diretor, que prometera transparência, havia sumido com o dinheiro do caixa.”",
"O verbo 'cair', no contexto, tem sentido:",
["Denotativo, indicando movimento físico de queda.","Conotativo, sugerindo impacto súbito e forte.","Denotativo, indicando queda de preço.","Conotativo, indicando queda de cabelo.","Neutro, sem carga expressiva."],
1,"'Cair como uma bomba' é expressão figurada que indica impacto brusco e negativo. Não há queda física (A), mudança de preço (C) nem uso neutro (E). 'Cair' é polissêmico e assume, aqui, sentido conotativo."
],
"Relação título-texto":[
"O título antecipa, resume, ironiza ou provoca a leitura do texto. Pode ter a função de síntese, de chamar atenção ou de criar expectativa. Em provas, a pergunta costuma pedir a relação entre o título e o conteúdo ou o efeito que ele produz.",
["Título pode resumir, ironizar, provocar","Nem sempre é literal","O título dialoga com o corpo do texto"],
"Se o título parece 'deslocado', provavelmente é irônico ou metafórico. Volte ao texto para confirmar.",
"Texto de autoria própria (adaptado): Título de reportagem fictícia: “O país que aprendeu a ler — e esqueceu de entender”. Conteúdo da matéria: dados mostram aumento do letramento básico, mas queda na interpretação de textos complexos.",
"A relação entre título e conteúdo é de:",
["Contradiz o texto, sem relação com o conteúdo.","Sintetiza, com ironia, a diferença entre ler e compreender.","Apenas chama a atenção, sem relação com o conteúdo.","Reproduz literalmente o texto.","Apresenta uma opinião contrária à do texto."],
1,"O título cria um paradoxo ('aprendeu a ler' × 'esqueceu de entender'), que sintetiza a tese do texto (letramento x interpretação) com ironia. Não contradiz (A), não é mero chamariz (C), não é cópia (D) nem oposição (E)."
],
"Denotação e conotação":[
"Denotação é o sentido literal, objetivo, dicionarizado da palavra. Conotação é o sentido figurado, subjetivo, que depende do contexto. Em 'a pedra é dura' (denotação) e 'aquele coração é uma pedra' (conotação), a mesma palavra assume sentidos diferentes. O ENEM cobra a identificação desses sentidos e seus efeitos expressivos.",
["Denotação: sentido literal","Conotação: sentido figurado","A conotação depende do contexto","Uma palavra pode ter os dois sentidos"],
"Pergunte: 'esse sentido está no dicionário ou foi criado pelo contexto?'. Se depende do contexto, é conotativo.",
"Texto de autoria própria: “O tempo voa quando estamos felizes.”",
"O verbo 'voar', no contexto, tem sentido:",
["Denotativo, indicando deslocamento físico.","Conotativo, sugerindo que o tempo passa rápido.","Denotativo, indicando viagem de avião.","Neutro, sem carga expressiva.","Técnico, usado em física."],
1,"'O tempo voa' é expressão figurada que indica rapidez. Não há deslocamento físico (A), viagem (C), neutralidade (D) nem sentido técnico (E). Trata-se de conotação."
],
"Tipos textuais: narração, descrição, dissertação e injunção":[
"Tipo textual é a estrutura básica do texto: narrar (contar fatos), descrever (caracterizar), dissertar (defender ideia), injungir (instruir, orientar). Um mesmo texto pode combinar tipos. Gênero textual é a forma socialmente reconhecida (crônica, receita, editorial). Não confunda tipo com gênero.",
["Narração: ações no tempo, personagens","Descrição: características, estados","Dissertação: ideias, argumentos","Injunção: verbos no imperativo, instruções","Tipo ≠ gênero"],
"Receita = gênero injuntivo. Crônica = gênero narrativo-dissertativo. Reportagem = gênero informativo.",
"Texto de autoria própria: “Misture a farinha e o açúcar. Acrescente os ovos, um a um, mexendo sempre. Leve ao forno preaquecido por 30 minutos.”",
"O tipo textual predominante é:",
["Narrativo.","Descritivo.","Dissertativo.","Injuntivo.","Argumentativo."],
3,"Verbos no imperativo ('misture', 'acrescente', 'leve') e a sequência de instruções caracterizam a injunção. Não há ações em sequência narrativa (A), características estáticas (B), defesa de opinião (C) nem argumentação (E)."
],
"Notícia e reportagem":[
"Notícia informa um fato recente de forma objetiva, com lead (o quê, quem, quando, onde, como, por quê). Reportagem aprofunda o tema, com contexto, dados, entrevistas e interpretação. Ambas buscam objetividade, mas a reportagem admite mais análise e vozes.",
["Notícia: fato recente, breve, objetiva","Reportagem: aprofundamento, contexto, vozes","Lead responde às 6 perguntas","Objetividade é um ideal, não uma ausência de escolhas"],
"Notícia é curta e factual; reportagem é longa e interpretativa. Título e subtítulo ajudam a reconhecer.",
"Texto de autoria própria (notícia fictícia, adaptada): “SÃO PAULO — Um incêndio atingiu, na madrugada desta terça-feira, um galpão na zona leste da cidade. Não houve vítimas. O Corpo de Bombeiros controlou o fogo em duas horas; as causas serão investigadas.”",
"Sobre o texto, é correto afirmar:",
["É uma reportagem, pois há entrevistas com moradores.","É uma notícia, pois apresenta o fato de forma breve e objetiva, respondendo às perguntas essenciais.","É uma crônica, pois parte de um fato cotidiano para reflexão.","É um editorial, pois expressa a opinião do jornal.","É um artigo de opinião, pois defende uma tese."],
1,"O texto apresenta um fato de forma breve e objetiva, com as informações essenciais (o quê, quando, onde, consequências). Não há entrevistas (A), reflexão pessoal (C), opinião institucional (D) nem tese argumentativa (E)."
],
"Crônica":[
"A crônica parte de um fato cotidiano, geralmente banal, para uma reflexão leve, humorística ou poética. Tem tom pessoal, subjetivo e, muitas vezes, coloquial. Publicada em jornais e revistas, é um gênero híbrido: mistura narração e comentário. Cronistas brasileiros: Machado de Assis, Rubem Braga, Fernando Sabino, Clarice Lispector, Luis Fernando Verissimo.",
["Parte do cotidiano","Tom pessoal e subjetivo","Humor, lirismo ou crítica leve","Gênero híbrido: narra e comenta"],
"Crônica é aquele texto curto que parece 'conversa com o leitor', com um 'eu' que reflete sobre o dia a dia.",
"Texto de autoria própria (crônica, adaptada para fins didáticos): “Sexta-feira à noite, o supermercado parecia um formigueiro. Todo mundo com pressa, carrinhos cheios, um casal discutindo qual marca de arroz levar. Pensei comigo: talvez a gente esteja sempre escolhendo arroz quando queria estar escolhendo vida.”",
"Sobre o texto, é correto afirmar:",
["Trata-se de uma notícia, pois relata um fato ocorrido no supermercado.","Trata-se de um artigo de opinião, pois defende tese sobre consumo.","Trata-se de uma crônica, pois parte do cotidiano e o ressignifica em tom pessoal.","Trata-se de um verbete, pois define o que é supermercado.","Trata-se de um editorial, pois expressa a opinião de um jornal."],
2,"O texto parte de uma cena banal (supermercado) e, em tom pessoal ('pensei comigo'), produz uma reflexão. Não é notícia (A), artigo (B), verbete (D) nem editorial (E)."
],
"Artigo de opinião":[
"O artigo de opinião defende uma tese com argumentos, geralmente assinado, publicado em jornais, revistas ou sites. Tem tom argumentativo, com marcas de subjetividade e uso frequente de dados, exemplos e autoridade. Distingue-se do editorial: este expressa a posição do veículo, sem assinatura individual.",
["Tese + argumentos","Assinado, opinião pessoal","Uso de dados, exemplos, autoridade","Editorial: opinião do veículo, não assinado"],
"Se o texto começa com uma afirmação forte e depois a defende, é artigo. Se é impessoal e fala em nome do jornal, é editorial.",
"Texto de autoria própria: “É preciso repensar o papel do celular nas escolas. Não se trata de demonizar a tecnologia, e sim de reconhecer que a atenção é um recurso escasso e precioso. Pesquisas mostram queda de desempenho em turmas com uso livre de aparelhos. Regular não é proibir: é ensinar a usar.”",
"O texto é um exemplo de:",
["Notícia.","Crônica.","Artigo de opinião.","Verbete de dicionário.","Manual de instruções."],
2,"Há tese explícita ('É preciso repensar o papel do celular'), argumentos (pesquisas, distinção conceitual) e marcas de subjetividade. Não é notícia (A) nem crônica (B); não define palavra (D) nem instrui passo a passo (E)."
],
"Editorial":[
"O editorial é um texto argumentativo que expressa a opinião de um veículo de comunicação (jornal, revista, portal). Não é assinado por uma pessoa, mas representa a posição institucional. Tem tom impessoal, defende uma tese e costuma abordar temas de interesse público.",
["Opinião do veículo","Não assinado","Tom impessoal","Tese defendida"],
"Não confunda editorial (opinião do jornal) com artigo de opinião (assinado por um autor). O editorial usa 'nós' institucional.",
"Texto de autoria própria (editorial fictício): “Este jornal defende que a educação midiática seja incluída no currículo escolar. Em tempos de desinformação, ensinar a checar fontes é tão essencial quanto ensinar a ler.”",
"O texto é um exemplo de:",
["Notícia.","Crônica.","Editorial.","Artigo de opinião assinado.","Reportagem."],
2,"O texto expressa a posição do veículo ('Este jornal defende'), sem assinatura, e defende uma tese. É um editorial. Não é notícia (A), crônica (B), artigo assinado (D) nem reportagem (E)."
],
"Entrevista":[
"A entrevista é um gênero dialógico em que um entrevistador faz perguntas a um entrevistado, com o objetivo de obter informações, opiniões ou testemunhos. Pode ser publicada em jornais, revistas, sites, podcasts ou programas de TV. A transcrição mantém marcas da oralidade.",
["Perguntas e respostas","Vozes do entrevistador e do entrevistado","Marcas de oralidade","Gênero jornalístico"],
"Em uma entrevista, as falas do entrevistado vêm em discurso direto. Observe quem fala e o que é informação nova.",
"Texto de autoria própria (trecho de entrevista fictícia): “— Professor, o que mudou no ensino de leitura? — Antes, lia-se para responder questionários; hoje, busca-se formar leitores críticos, capazes de interpretar e questionar.”",
"O trecho é exemplo de:",
["Notícia.","Editorial.","Entrevista.","Crônica.","Verbete."],
2,"Há perguntas e respostas, com discurso direto, caracterizando a entrevista. Não é notícia (A), editorial (B), crônica (D) nem verbete (E)."
],
"Texto de divulgação científica":[
"O texto de divulgação científica traduz conhecimentos especializados para o público geral, usando linguagem acessível, exemplos e analogias. Mantém o rigor da informação, mas evita jargões excessivos. É comum em revistas como Ciência Hoje e Superinteressante, e em sites de universidades.",
["Linguagem acessível","Rigor científico preservado","Analogias e exemplos","Público não especialista"],
"Não confunda com artigo científico (destinado a pares, com jargão técnico). A divulgação científica adapta a linguagem.",
"Texto de autoria própria (adaptado): “Pesquisadores descobriram que dormir menos de seis horas por noite aumenta o risco de problemas cardíacos. O estudo acompanhou 10 mil pessoas por cinco anos. 'O sono é um remédio gratuito', resume a cardiologista.”",
"O texto é exemplo de:",
["Artigo científico original.","Texto de divulgação científica.","Editorial.","Notícia policial.","Verbete."],
1,"O texto traduz um estudo para o público geral, com linguagem acessível e citação de especialista. É divulgação científica. Não é artigo original (A), editorial (C), notícia policial (D) nem verbete (E)."
],
"Charge, tirinha e anúncio":[
"Charge é desenho de humor com crítica política ou social, geralmente ligada a um fato do momento. Tirinha é narrativa curta em quadrinhos, com personagens fixos e humor recorrente. Anúncio publicitário busca persuadir o consumidor, combinando imagem, texto e apelo emocional. Nos três, a leitura depende da articulação entre linguagem verbal e não verbal.",
["Charge: crítica social ou política, atual","Tirinha: humor em quadrinhos, personagens fixos","Anúncio: persuasão, apelo ao consumo","Verbal + não verbal constroem sentido"],
"Na charge, procure o fato do momento. Na tirinha, observe a quebra de expectativa. No anúncio, identifique o público-alvo e o apelo.",
"Descrição de tirinha (texto adaptado): No primeiro quadrinho, um menino diz: 'Pai, o que é crise?'. No segundo, o pai responde: 'Crise é quando o dinheiro some'. No terceiro, o menino, olhando o celular do pai, pergunta: 'E o senhor já foi procurar no Google Maps?'.",
"O efeito de humor da tirinha está:",
["Na informação incorreta dada pelo pai.","Na quebra de expectativa: o menino trata 'crise' como objeto localizável.","Na tristeza do menino.","No uso do celular como tema principal.","Na repetição de palavras."],
1,"O humor vem do deslocamento de sentido: 'crise' (conceito econômico) é tratada como algo que se pode localizar, como num mapa. A alternativa A erra a informação; C, D e E não são a fonte do riso."
],
"Gêneros literários: lírico, épico e dramático":[
"Os gêneros literários são as grandes categorias que classificam as obras segundo sua forma e conteúdo. O gênero lírico expressa sentimentos e emoções do eu poético, geralmente em versos. O épico narra feitos heroicos e acontecimentos históricos, com narrador e personagens. O dramático é destinado à encenação, com diálogos e rubricas, representado por atores.",
["Lírico: sentimentos e emoções","Épico: narrativa de feitos heroicos","Dramático: destinado à encenação","Soneto, epopeia e peça teatral são exemplos"],
"Não confunda gênero literário (lírico, épico, dramático) com movimento literário (Barroco, Romantismo) nem com tipo textual (narração, descrição).",
"Texto de autoria própria (adaptado): “A peça encenada no teatro municipal apresentava diálogos entre personagens e rubricas que indicavam os movimentos dos atores no palco. A plateia acompanhava a história de Romeu e Julieta, comovida com o desfecho trágico.”",
"O trecho descreve uma obra do gênero:",
["Lírico.","Épico.","Dramático.","Narrativo.","Dissertativo."],
2,"A presença de diálogos, rubricas e encenação por atores caracteriza o gênero dramático. Não é lírico (A, que expressa sentimentos), épico (B, que narra feitos heroicos) nem tipo textual (D, E)."
],
"Variação regional (diatópica)":[
"Variação regional é a diferença linguística entre falantes de regiões diferentes: sotaques, vocabulário (mandioca/aipim/macaxeira) e construções. É fenômeno natural de toda língua viva e não indica erro nem pobreza. O ENEM cobra o reconhecimento de variedades e o respeito a elas.",
["Variação diatópica = regional","Vocabulário, pronúncia e sintaxe variam","Nenhuma variedade é superior","Adequação ≠ correção"],
"Não confunda variação com erro. Regionalismo é variedade; o 'erro' existe só em relação a uma norma de referência.",
"Texto de autoria própria: “Em Minas, 'trem' é qualquer coisa. 'Que trem bom!' pode se referir a uma comida, a uma pessoa, a um lugar. Em outras regiões, a mesma palavra designa apenas o veículo sobre trilhos.”",
"Sobre o trecho, é correto afirmar:",
["O uso mineiro de 'trem' é um erro de português.","O uso mineiro de 'trem' é uma variação regional legítima, com sentidos ampliados.","A palavra 'trem' deveria ser banida do vocabulário.","O texto mostra que mineiros falam errado.","A variação só existe na fala, nunca na escrita."],
1,"O texto ilustra a variação regional (diatópica): em Minas, 'trem' amplia o sentido. A variedade é legítima e não constitui erro. A variação também aparece na escrita literária e em outras manifestações."
],
"Variação social (diastrática)":[
"Variação social é a diferença linguística associada a grupos sociais, faixas etárias, profissões ou graus de escolaridade. Um médico fala de forma diferente de um jogador em campo; um jovem de um idoso. Essas variedades convivem e se adequam a contextos — não há hierarquia entre elas como valor humano.",
["Variação diastrática = grupos sociais","Jargões profissionais, gírias de grupos","Faixa etária e escolaridade influenciam","Não confunda com 'certo' e 'errado'"],
"Não rotule falantes nem julgue variedades. Descreva o fenômeno, não o hierarquize.",
"Texto de autoria própria (adaptado, com dados fictícios): “Em uma partida de futebol, o técnico grita: 'Marca em cima, pressiona, sobe a linha!'. Em uma sala de aula, o mesmo técnico explica a regra do impedimento em linguagem técnica. O mesmo falante, duas variedades.”",
"O trecho ilustra:",
["Erro gramatical do técnico.","Incapacidade do técnico de falar português correto.","Variação social e situacional: o falante ajusta a variedade ao contexto.","Confusão mental do falante.","Que só existe uma forma correta de falar."],
2,"O exemplo mostra o mesmo falante ajustando a linguagem ao contexto (campo × sala de aula). É variação, não erro. As alternativas A, B e D julgam o falante; E nega a variação."
],
"Variação situacional e registro":[
"Variação situacional (diafásica) ocorre quando o mesmo falante muda a linguagem conforme a situação: um e-mail para o chefe é diferente de uma mensagem no grupo da família. Registro é o grau de formalidade: formal, informal, técnico, coloquial. A escolha depende do interlocutor, do gênero e do suporte.",
["Variação diafásica = situação","Registro formal × informal","Adequação ao contexto","Mesmo falante, várias variedades"],
"Cobrança recorrente: avaliar se a linguagem é adequada ao contexto, não se é 'bonita' ou 'feia'.",
"Texto de autoria própria: “Aluno escreve ao professor: 'E aí, prof, beleza? Manda a nota aí, tô ansioso.' Na semana seguinte, escreve à coordenação: 'Prezados, solicito a divulgação das notas do bimestre.'.”",
"O trecho evidencia:",
["Que o aluno não sabe escrever.","Variação situacional: o aluno ajusta o registro ao interlocutor.","Que a primeira mensagem é um erro de português.","Que a segunda mensagem é falsa e pomposa.","Que só a segunda mensagem tem valor."],
1,"O mesmo aluno ajusta a linguagem (informal × formal) conforme o interlocutor. Isso é variação diafásica. Não se trata de erro nem de falsidade: é adequação."
],
"Variação histórica":[
"A língua muda com o tempo: palavras e construções que eram comuns em séculos passados hoje soam arcaicas, e novas formas surgem a cada geração. Esse é o fenômeno da variação histórica (ou diacrônica). O português do século XVI, de Camões, é diferente do português atual; 'vossa mercê' virou 'você', e 'pharmácia' virou 'farmácia'.",
["Variação diacrônica = ao longo do tempo","Arcaísmos e neologismos","A língua é viva e mutável","Não confunda com 'erro'"],
"Questões que comparam textos de épocas diferentes costumam pedir a identificação de arcaísmos ou de mudanças ortográficas. A mudança não é decadência.",
"Texto de autoria própria (adaptado): “No século XIX, escrevia-se 'vossa mercê'; depois, 'vosmecê'; hoje, 'você'. A forma atual não é um erro: é o resultado de um longo processo de mudança linguística.”",
"A afirmação ilustra:",
["Erro gramatical progressivo.","Variação histórica: a língua muda ao longo do tempo.","Variação regional.","Variação social.","Ausência de norma."],
1,"A transformação de 'vossa mercê' em 'você' é um exemplo clássico de variação histórica (diacrônica). Não há erro (A), nem se trata de diferença regional (C) ou social (D). A norma-padrão registra a forma atual."
],
"Variação etária":[
"A variação etária (ou geracional) ocorre quando grupos de diferentes idades usam a língua de modo distinto. Gírias de uma geração podem soar datadas para outra; expressões como 'na moral', 'massa' ou 'irado' marcam época. A variação etária é uma forma de variação social, ligada à faixa de idade.",
["Diferenças de uso por faixa etária","Gírias geracionais","Marca de identidade do grupo","Não é erro, é variação"],
"Se um texto mostra um adulto que não entende uma gíria de jovem, ou um jovem que acha a fala do avô 'antiga', há variação etária.",
"Texto de autoria própria: “A avó disse: 'Que rapaz atencioso!'. A neta respondeu: 'Ele é mó legal, vó!'. As duas falam português; usam variedades diferentes.”",
"O trecho exemplifica:",
["Erro de português da neta.","Variação etária: avó e neta usam variedades distintas da língua.","Que a avó fala melhor que a neta.","Que a neta não sabe português.","Que gírias são erros."],
1,"'Mó legal' é marca de variedade juvenil; 'atencioso' é mais formal. Trata-se de variação etária, não de erro. As alternativas C, D e E hierarquizam falantes indevidamente."
],
"Norma-padrão, norma culta e adequação":[
"Norma-padrão é a variedade prescrita por gramáticas e manuais, associada à escrita formal. Norma culta é a variedade efetivamente usada por falantes escolarizados em situações formais. Nem sempre coincidem. Adequação é escolher a variedade certa para o contexto — não existe 'a única forma correta'.",
["Norma-padrão: prescrição","Norma culta: uso efetivo dos escolarizados","Norma-padrão ≠ norma culta","Adequação: escolha pelo contexto"],
"Cuidado: 'norma culta' não é sinônimo de 'norma-padrão'. ENEM cobra essa distinção em várias questões.",
"Texto de autoria própria: “Grandes escritores modernistas usaram, na literatura, construções que a gramática tradicional condena — e fizeram isso de propósito, para representar a fala brasileira.”",
"A afirmação é coerente com a ideia de que:",
["A gramática tradicional sempre está certa.","A norma-padrão é a única forma aceitável na literatura.","A norma culta e a norma-padrão podem divergir, e a literatura registra esse uso.","A literatura não pode inovar.","Escritores que inovam escrevem errado."],
2,"A literatura modernista (Mário de Andrade, Guimarães Rosa) registra a fala brasileira, distinta da norma-padrão, sem que isso seja erro. Norma culta (uso) e norma-padrão (prescrição) podem divergir."
],
"Gírias, jargões e preconceito linguístico":[
"Gíria é vocabulário típico de um grupo ou geração, com validade passageira. Jargão é vocabulário técnico de uma área. Preconceito linguístico é julgar pessoas por sua variedade, tratando diferenças como erros ou sinais de ignorância. Combater esse preconceito é reconhecer a variação como fenômeno social.",
["Gíria: grupo e época","Jargão: área técnica","Preconceito linguístico: julgar falantes","Toda variedade é legítima"],
"Uma variedade não é 'feia' ou 'errada': é diferente. A norma-padrão é uma ferramenta de adequação, não um critério de valor humano.",
"Texto de autoria própria (adaptado): “Ao ouvir um estudante dizer 'nós vai', uma professora corrigiu: 'Não é assim que se fala'. O aluno, morador da periferia, silenciou. Pesquisadores apontam que a correção sem explicação reforça o preconceito linguístico.”",
"Sobre o episódio, é correto afirmar:",
["A professora agiu corretamente, pois 'nós vai' é erro grave.","A atitude da professora reforça o preconceito linguístico ao desqualificar a variedade do aluno sem explicar a norma.","O aluno deveria ser reprovado.","A variedade do aluno é inferior à norma-padrão.","Todas as variedades são idênticas."],
1,"'Nós vai' é marca de variedade popular, não erro de raciocínio. A correção sem mediação desqualifica o falante e reforça o preconceito. Variedades não são superiores ou inferiores entre si: são adequadas ou não a contextos."
],
"Elementos da comunicação":[
"Todo ato comunicativo envolve seis elementos: emissor (quem fala), receptor (a quem se fala), mensagem (o que se diz), código (a língua ou sistema), canal (o meio) e contexto (a situação). A ênfase em cada um desses elementos corresponde a uma função da linguagem.",
["Emissor","Receptor","Mensagem","Código","Canal","Contexto"],
"Se a mensagem fala sobre o próprio código, é metalinguística. Se fala do canal, é fática.",
"Descrição de esquema (adaptado): Emissor → Mensagem → Receptor (com Código, Canal e Contexto atravessando o processo).",
"Em uma conversa telefônica, quando alguém diz 'Alô? Está me ouvindo?', a ênfase recai sobre qual elemento?",
["Emissor.","Receptor.","Mensagem.","Código.","Canal."],
4,"'Alô? Está me ouvindo?' testa o canal (o meio físico). Essa é a função fática. Não se refere ao emissor (A), ao receptor em si (B), nem ao conteúdo (C) nem ao código (D)."
],
"Função referencial":[
"A função referencial (ou denotativa) enfatiza o contexto, a informação objetiva, os fatos. É típica de notícias, textos científicos, manuais. Linguagem impessoal, denotativa, com verbos no presente ou pretérito do indicativo.",
["Ênfase no contexto","Linguagem objetiva e denotativa","Típica de notícias e textos científicos","Informa, não opina"],
"Se o texto informa sem opinar, é referencial. Se o autor se expõe, é emotiva.",
"Texto de autoria própria: “A água ferve a 100 °C ao nível do mar. Em altitudes maiores, a temperatura de ebulição diminui, o que exige mais tempo de cozimento.”",
"A função da linguagem predominante é:",
["Emotiva.","Conativa.","Referencial.","Poética.","Fática."],
2,"O texto informa de modo objetivo, sem marcas de emissor nem de apelo ao receptor. É referencial. As demais funções enfatizam emissor (A), receptor (B), forma (D) ou canal (E)."
],
"Função emotiva":[
"A função emotiva (ou expressiva) enfatiza o emissor, suas emoções, opiniões e sentimentos. Marcas típicas: 1ª pessoa, interjeições, adjetivação valorativa. É comum em diários, poemas líricos, cartas pessoais, letras de música confessionais.",
["Ênfase no emissor","1ª pessoa, interjeições","Subjetividade","Poema lírico e diário são exemplos"],
"Dica: se o texto está centrado no 'eu' que sente, é emotiva. Não confunda com poética, que enfatiza a forma.",
"Texto de autoria própria (adaptado): “Ah, como eu queria voltar àquela tarde! Sinto ainda o cheiro do mar, o calor do sol na pele, a alegria simples de existir.”",
"A função da linguagem predominante é:",
["Referencial.","Emotiva.","Conativa.","Metalinguística.","Fática."],
1,"Marcas de 1ª pessoa ('eu queria', 'sinto'), interjeição ('Ah!') e adjetivação afetiva indicam função emotiva. Não é referencial (A), nem apela ao receptor (C), nem fala do código (D) nem do canal (E)."
],
"Função conativa":[
"A função conativa (ou apelativa) enfatiza o receptor: busca influenciá-lo, convencê-lo ou orientá-lo. Marcas: verbos no imperativo, vocativos, 2ª pessoa. É típica de publicidade, propaganda, discursos políticos e manuais.",
["Ênfase no receptor","Imperativo, vocativo","Publicidade e propaganda","Busca convencer ou orientar"],
"Se o texto interpela diretamente o leitor ('Venha!', 'Você merece'), é conativa.",
"Texto de autoria própria: “Você que sempre sonhou em falar inglês: chegou a sua chance. Matricule-se hoje e ganhe 30% de desconto. Não perca!”",
"A função da linguagem predominante é:",
["Emotiva.","Referencial.","Conativa.","Poética.","Metalinguística."],
2,"O texto interpela o leitor ('Você', 'Matricule-se', 'Não perca'), caracterizando função conativa. Não há marca de emissor (A), nem informação objetiva (B), nem exploração formal (D) nem foco no código (E)."
],
"Função fática":[
"A função fática enfatiza o canal da comunicação: testar se ele está funcionando, iniciar, manter ou encerrar o contato. Expressões como 'alô?', 'está me ouvindo?', 'né?', 'tá?', 'entendeu?' são típicas. É comum em conversas telefônicas e em interações rápidas.",
["Ênfase no canal","Testa ou mantém o contato","'Alô?', 'Tá me ouvindo?', 'Né?'","Comum em telefonemas"],
"Se a mensagem não traz informação nova, mas apenas verifica o contato, é fática.",
"Texto de autoria própria: “— Alô? — Oi, tudo bem? — Tudo. Você está me ouvindo bem? — Estou.”",
"A função da linguagem predominante é:",
["Referencial.","Emotiva.","Fática.","Poética.","Metalinguística."],
2,"As falas testam o canal ('Alô?', 'Você está me ouvindo bem?'). É função fática. Não há informação objetiva (A), emoção (B), exploração formal (D) nem foco no código (E)."
],
"Função poética":[
"A função poética enfatiza a forma da mensagem: ritmo, sonoridade, rimas, figuras, repetições, jogos de palavras. Não se restringe a poemas: aparece em slogans, manchetes, letras de música e anúncios. O que importa é a elaboração da linguagem.",
["Ênfase na forma da mensagem","Ritmo, rima, sonoridade","Figuras de linguagem","Não só em poemas"],
"Se a escolha das palavras importa mais do que a informação em si, é poética. Em 'a vida é uma estrada', a metáfora é poética.",
"Texto de autoria própria: “O vento venta, a chuva chove, o tempo passa e não se move.”",
"A função da linguagem predominante é:",
["Referencial.","Fática.","Poética.","Conativa.","Emotiva."],
2,"Há repetição sonora ('vento venta', 'chuva chove'), ritmo e jogo de palavras. É função poética. Não há informação objetiva (A), teste de canal (B), apelo ao receptor (D) nem foco no emissor (E)."
],
"Função metalinguística":[
"A função metalinguística ocorre quando a linguagem fala de si mesma: definições de dicionário, gramáticas, comentários sobre o próprio texto, versos que discutem a poesia. O código é o foco.",
["Linguagem fala de si mesma","Dicionário e gramática","Comentário sobre o texto","Foco no código"],
"Se o texto define uma palavra, comenta a própria escrita ou explica um termo, é metalinguística.",
"Texto de autoria própria: “'Poesia', no dicionário, é a arte de compor versos. Mas quem já leu um poema sabe que a definição não cabe no verbete.”",
"A função que predomina no trecho é:",
["Fática.","Emotiva.","Poética.","Metalinguística.","Conativa."],
3,"O texto discute o significado de 'poesia', isto é, usa a linguagem para falar da própria linguagem. É metalinguística. Não testa canal (A), não enfatiza emissor (B), não explora a forma (C) nem interpela o leitor (E)."
],
"Trovadorismo":[
"O Trovadorismo é o primeiro movimento literário da língua portuguesa, situado na Idade Média (séculos XII a XV). As cantigas são sua principal manifestação: cantigas de amor (eu lírico masculino sofre por dama idealizada), de amigo (eu lírico feminino lamenta a ausência do amado), de escárnio e de maldizer (satíricas). Autores como D. Dinis e Paio Soares de Taveirós compõem esse período.",
["Séculos XII-XV","Cantigas de amor, amigo, escárnio e maldizer","Eu lírico feminino nas cantigas de amigo","D. Dinis, Paio Soares de Taveirós"],
"Nas cantigas de amigo, o eu lírico é feminino e lamenta a ausência do amado. Não confunda com cantigas de amor, de eu lírico masculino.",
"Citação (domínio público): “Ai flores, ai flores do verde pino, / se sabedes novas do meu amigo! / Ai Deus, e u é?” (D. Dinis, Cantiga de amigo)",
"Sobre o trecho, é correto afirmar:",
["Pertence às cantigas de amor, com eu lírico masculino.","Pertence às cantigas de amigo: eu lírico feminino lamenta a ausência do amado.","Pertence ao Classicismo, pela referência à natureza.","Pertence ao Romantismo, pela idealização.","Pertence ao Barroco, pelo conflito religioso."],
1,"O eu lírico feminino pergunta pelas 'novas do meu amigo': é cantiga de amigo, típica do Trovadorismo. Não é cantiga de amor (A), nem Classicismo (C), Romantismo (D) ou Barroco (E)."
],
"Humanismo":[
"O Humanismo (séculos XV-XVI) é a transição entre a Idade Média e o Renascimento. Caracteriza-se pela valorização do ser humano, da razão e da cultura greco-latina. Em Portugal, destacam-se o teatro de Gil Vicente (Auto da Barca do Inferno) e a poesia palaciana. É o momento em que a literatura se volta para o homem, não apenas para Deus.",
["Séculos XV-XVI","Transição Idade Média → Renascimento","Valorização do ser humano","Gil Vicente, poesia palaciana"],
"Não confunda Humanismo (transição, Gil Vicente) com Classicismo (Renascimento, Camões). O Humanismo precede o Classicismo.",
"Texto de autoria própria (adaptado): “O Auto da Barca do Inferno, de Gil Vicente, encenado no século XVI, retrata personagens da sociedade portuguesa chegando à barca que os levará ao inferno ou ao paraíso. Com humor e crítica, o autor satiriza as classes sociais.”",
"Sobre o trecho, é correto afirmar:",
["É exemplo de Classicismo, pela epopeia.","É exemplo de Humanismo: teatro de Gil Vicente, com crítica social e transição para o Renascimento.","É exemplo de Barroco, pelo conflito religioso.","É exemplo de Romantismo, pela idealização.","É exemplo de Trovadorismo, pelas cantigas."],
1,"O Auto da Barca do Inferno é a obra-síntese do Humanismo português: teatro crítico e transição. Não é Classicismo (A), Barroco (C), Romantismo (D) nem Trovadorismo (E)."
],
"Classicismo":[
"O Classicismo (século XVI, Renascimento) retoma os ideais greco-latinos: equilíbrio, harmonia, racionalidade, formas clássicas. Em Portugal, Luís Vaz de Camões escreve Os Lusíadas (1572), epopeia que narra as navegações portuguesas e a história do povo lusitano. O soneto é a forma lírica mais cultivada. A linguagem é culta e elaborada.",
["Século XVI","Equilíbrio, harmonia, racionalidade","Camões e Os Lusíadas","Soneto, epopeia, medida nova"],
"Não confunda Classicismo (Camões, equilíbrio) com Barroco (conflito, século XVII). São movimentos opostos.",
"Citação (domínio público): “As armas e os barões assinalados, / Que da ocidental praia Lusitana, / Por mares nunca de antes navegados, / Passaram ainda além da Taprobana.” (Luís de Camões, Os Lusíadas, Canto I)",
"Sobre o trecho, é correto afirmar:",
["Pertence ao Barroco, pelo conflito religioso.","Pertence ao Classicismo: epopeia camoniana, exaltação dos feitos portugueses com equilíbrio formal.","Pertence ao Romantismo, pela exaltação da pátria.","Pertence ao Realismo, pela crítica social.","Pertence ao Modernismo, pela linguagem coloquial."],
1,"Os versos abrem Os Lusíadas, epopeia clássica que exalta as navegações. Não é Barroco (A), Romantismo (C), Realismo (D) nem Modernismo (E)."
],
"Barroco":[
"O Barroco (século XVII, no Brasil com Gregório de Matos e o padre Antônio Vieira) é marcado pelo conflito entre fé e razão, efêmero e eterno, corpo e alma. Usa antíteses, paradoxos, hipérboles e cultismo (jogo de palavras) e conceptismo (jogo de ideias). É a estética do conflito e da instabilidade.",
["Século XVII","Conflito fé × razão, corpo × alma","Cultismo e conceptismo","Antíteses e paradoxos","Autores: Gregório de Matos, Vieira"],
"Não confunda Barroco (conflito, século XVII) com Arcadismo (equilíbrio, século XVIII) nem com Romantismo (sentimento, século XIX).",
"Citação (domínio público): “Que és, enfim, vaidade? / Um nada que parece, / Que, parecendo, engana, / Que, enganando, agrada, / Que, agradando, mata.” (adaptado de Sermão da Sexagésima, de Antônio Vieira)",
"Sobre o trecho, é correto afirmar:",
["É um exemplo de Arcadismo, com exaltação da vida simples no campo.","É um exemplo de Barroco, com jogo conceptista sobre a vaidade, marcado por antíteses e paradoxos.","É um exemplo de Romantismo, com subjetividade exacerbada.","É um exemplo de Realismo, com crítica social objetiva.","É um exemplo de Parnasianismo, com valorização da forma."],
1,"O trecho joga com conceitos (vaidade que engana e mata), procedimento conceptista típico do Barroco. Não há bucolismo arcádico (A), nem subjetividade romântica (C), nem crítica realista (D) nem formalismo parnasiano (E)."
],
"Arcadismo":[
"O Arcadismo (século XVIII, no Brasil com Cláudio Manuel da Costa, Tomás Antônio Gonzaga, Basílio da Gama e Santa Rita Durão) retoma ideais clássicos: simplicidade, equilíbrio, bucolismo. O poeta assume o papel de pastor (fugere urbem, carpe diem, aurea mediocritas). Há idealização da vida no campo e crítica velada ao mundo urbano.",
["Século XVIII","Bucolismo, pastoralismo","Carpe diem, aurea mediocritas","Cláudio Manuel da Costa, Gonzaga","Equilíbrio, simplicidade"],
"Arcadismo idealiza a natureza e a vida simples; Romantismo idealiza o herói e a pátria. Não confunda.",
"Citação (domínio público): “Eu, Marília, não sou algum vaqueiro, / Que viva de guardar alheio gado; / De tosco trato, de expressões grosseiro, / Dos frios gelos, e dos sóis queimado.” (Tomás Antônio Gonzaga, Marília de Dirceu)",
"Sobre o trecho, é correto afirmar:",
["Pertence ao Barroco, pelo conflito religioso.","Pertence ao Arcadismo: o eu lírico assume a persona de pastor, idealizando a vida simples.","Pertence ao Romantismo, pela exaltação da pátria.","Pertence ao Realismo, pela crítica social.","Pertence ao Modernismo, pela linguagem coloquial."],
1,"O eu lírico, embora diga que não é vaqueiro, assume o universo pastoral (persona do pastor), procedimento típico do Arcadismo. Não há conflito barroco (A), exaltação romântica (C), crítica realista (D) nem linguagem modernista (E)."
],
"Romantismo":[
"O Romantismo brasileiro (século XIX) divide-se em três fases: indianista (Gonçalves Dias, exaltação do índio e da pátria), ultrarromântica (Álvares de Azevedo, pessimismo, morte, escapismo) e condoreira (Castro Alves, poesia social e abolicionista). Valoriza subjetividade, sentimento, natureza e liberdade. Na prosa, destacam-se José de Alencar e Manuel Antônio de Almeida.",
["Subjetividade, sentimento","Indianismo, ultrarromantismo, condoreirismo","Gonçalves Dias, Álvares de Azevedo, Castro Alves","Exaltação da pátria e da liberdade"],
"Distinga: indianista (Gonçalves Dias) ≠ ultrarromântico (Álvares de Azevedo) ≠ condoreiro (Castro Alves).",
"Citação (domínio público): “Minha terra tem palmeiras, / Onde canta o Sabiá; / As aves, que aqui gorjeiam, / Não gorjeiam como lá.” (Gonçalves Dias, Canção do Exílio, 1843)",
"Sobre o trecho, é correto afirmar:",
["É Arcadismo, pela idealização do campo.","É Romantismo indianista, pela exaltação da pátria e da terra natal.","É Barroco, pelo conflito entre fé e razão.","É Parnasianismo, pela forma rígida.","É Modernismo, pela linguagem coloquial."],
1,"'Canção do Exílio' é o poema-síntese do Romantismo indianista: exaltação da pátria e saudosismo. Não é Arcadismo (A), Barroco (C), Parnasianismo (D) nem Modernismo (E)."
],
"Realismo e Naturalismo":[
"Realismo (segunda metade do século XIX) busca retratar a realidade com objetividade, criticando a sociedade burguesa, suas hipocrisias e instituições. Machado de Assis é o grande nome. Naturalismo radicaliza: vê o ser humano como produto do meio, da hereditariedade e do instinto; Aluísio Azevedo (O Cortiço) é referência. Ambos abandonam o idealismo romântico.",
["Realismo: crítica social, análise psicológica","Naturalismo: determinismo, cientificismo","Machado de Assis, Aluísio Azevedo","Ruptura com o idealismo romântico"],
"Não confunda Realismo (crítica pela ironia, análise) com Naturalismo (determinismo biológico e social).",
"Citação (domínio público): “Ao vencedor, as batatas!” (Machado de Assis, Quincas Borba, 1891)",
"Sobre a frase, é correto afirmar:",
["É lema romântico de exaltação do herói.","É expressão do Realismo: com ironia, sintetiza a lei do mais forte nas relações humanas e sociais.","É lema parnasiano de valorização da forma.","É expressão simbolista de transcendência.","É lema árcade de vida simples."],
1,"'Ao vencedor, as batatas!' é a máxima do Humanitismo, filosofia irônica de Quincas Borba, que satiriza a luta pela vida e a hipocrisia social. É Realismo. Não é Romantismo (A), Parnasianismo (C), Simbolismo (D) nem Arcadismo (E)."
],
"Parnasianismo, Simbolismo e Pré-Modernismo":[
"Parnasianismo (final do século XIX) valoriza a forma perfeita, rimas ricas, sonetos, vocabulário rebuscado, temas greco-romanos: 'arte pela arte'. Olavo Bilac é o grande nome. Simbolismo busca o mistério, a musicalidade, a sinestesia, o inconsciente: Cruz e Sousa. Pré-Modernismo (início do século XX) não é escola, mas conjunto de obras que antecipam questões sociais e modernas: Euclides da Cunha, Lima Barreto, Monteiro Lobato, Augusto dos Anjos.",
["Parnasianismo: forma perfeita, soneto","Simbolismo: musicalidade, mistério","Pré-Modernismo: transição, crítica social","Bilac, Cruz e Sousa, Lima Barreto, Euclides"],
"Parnasianismo = forma. Simbolismo = sugestão. Pré-Modernismo = denúncia social.",
"Citação (domínio público): “Longe do estéril turbilhão da rua, / Beneditino, escreve! No aconchego / Do claustro, na paciência e no sossego, / Trabalha, e teima, e lima, e sofre, e sua!” (Olavo Bilac, Profissão de Fé)",
"Sobre o trecho, é correto afirmar:",
["É Simbolismo, pela musicalidade e mistério.","É Pré-Modernismo, pela crítica social.","É Parnasianismo: exalta o trabalho paciente com a forma, a 'arte pela arte'.","É Romantismo, pela subjetividade exacerbada.","É Barroco, pelos conflitos religiosos."],
2,"'Profissão de Fé' é o manifesto do Parnasianismo: culto à forma, ao trabalho artesanal do verso. Não é Simbolismo (A), Pré-Modernismo (B), Romantismo (D) nem Barroco (E)."
],
"Vanguardas europeias e Semana de 22":[
"As vanguardas europeias (Futurismo, Cubismo, Dadaísmo, Surrealismo, Expressionismo) rompem com a tradição, valorizando velocidade, fragmentação, inconsciente, choque. A Semana de Arte Moderna (São Paulo, fevereiro de 1922) reúne artistas como Mário de Andrade, Oswald de Andrade, Anita Malfatti e Villa-Lobos, propondo uma arte brasileira, livre de academicismos.",
["Vanguardas: ruptura e experimentação","Semana de 22: marco do Modernismo brasileiro","Mário e Oswald de Andrade, Anita Malfatti","Nacionalismo crítico e linguagem inovadora"],
"A Semana de 22 foi em fevereiro de 1922, no Theatro Municipal de São Paulo. Não confunda com a Semana de Arte Moderna de outras cidades.",
"Texto de autoria própria (adaptado): “A Semana de Arte Moderna, realizada em fevereiro de 1922 no Theatro Municipal de São Paulo, provocou escândalo ao apresentar poesia livre de métrica rígida, música dissonante e telas expressionistas. O público vaiava; os artistas, porém, abriam caminho para uma arte brasileira, moderna e crítica.”",
"Sobre a Semana de 22, é correto afirmar:",
["Foi um evento de exaltação do Parnasianismo.","Foi um encontro de artistas acadêmicos, fiéis às regras clássicas.","Foi um marco do Modernismo brasileiro, com ruptura de padrões e proposta de arte nacional e inovadora.","Foi um evento exclusivamente literário, sem participação de músicos ou artistas plásticos.","Foi um movimento contrário à liberdade formal."],
2,"A Semana de 22 é o marco inaugural do Modernismo brasileiro, com ruptura de padrões e proposta de arte nacional. Participaram escritores, músicos e artistas plásticos. As demais alternativas contradizem o evento."
],
"Modernismo: 1ª fase":[
"A 1ª fase do Modernismo brasileiro (1922-1930) é heroica: busca romper com o passado, valorizar a língua brasileira, o humor, a paródia, o cotidiano. Mário de Andrade (Pauliceia Desvairada, Macunaíma) e Oswald de Andrade (Manifesto Antropófago, Manifesto Pau-Brasil) são centrais. Há nacionalismo crítico e experimentalismo formal.",
["1922-1930","Ruptura e experimentação","Mário e Oswald de Andrade","Manifestos Pau-Brasil e Antropófago","Linguagem coloquial e paródia"],
"'Macunaíma' (1928), de Mário de Andrade, é o romance-síntese da 1ª fase.",
"Citação (domínio público, 1ª fase): “No meio do caminho tinha uma pedra / tinha uma pedra no meio do caminho / tinha uma pedra / no meio do caminho tinha uma pedra.” (Carlos Drummond de Andrade, No meio do caminho, 1928)",
"Sobre o poema, é correto afirmar:",
["Pertence ao Parnasianismo, pela forma fixa.","Pertence à 1ª fase do Modernismo: repetição, verso livre, banalidade elevada a tema poético.","Pertence ao Barroco, pelo conflito religioso.","Pertence ao Romantismo, pela idealização.","Pertence ao Simbolismo, pela musicalidade."],
1,"A repetição hipnótica, o verso livre e o tema banal (a pedra) são marcas da 1ª fase modernista. O poema foi publicado em 1928. Não é Parnasianismo (A), Barroco (C), Romantismo (D) nem Simbolismo (E)."
],
"Modernismo: 2ª e 3ª fases":[
"A 2ª fase (1930-1945) é de consolidação: romance regionalista de 30 (Graciliano Ramos, Rachel de Queiroz, Jorge Amado, Érico Veríssimo) e poesia de Drummond, Murilo Mendes, Cecília Meireles, Vinicius de Moraes. A 3ª fase (1945-1960) é o Pós-Modernismo/Geração de 45: rigor formal, Clarice Lispector e Guimarães Rosa na prosa, João Cabral de Melo Neto na poesia.",
["2ª fase: romance de 30 e poesia madura","3ª fase: rigor formal, inovação linguística","Graciliano, Drummond, Clarice, Rosa, Cabral","Aprofundamento social e existencial"],
"Graciliano Ramos (Vidas Secas) e Rachel de Queiroz (O Quinze) são da 2ª fase. Guimarães Rosa e Clarice Lispector, da 3ª.",
"Texto de autoria própria (adaptado): “Em Vidas Secas, Graciliano Ramos narra a luta de uma família sertaneja contra a seca, com linguagem enxuta e foco nos bichos e no silêncio. O romance pertence à 2ª fase do Modernismo, chamada de regionalista.”",
"Sobre o romance, é correto afirmar:",
["Pertence à 1ª fase modernista, pela experimentação radical.","Pertence à 2ª fase: romance regionalista de 30, com crítica social e linguagem enxuta.","Pertence à 3ª fase, pelo rigor formal e experimental.","Pertence ao Romantismo, pela idealização do sertanejo.","Pertence ao Naturalismo, pelo determinismo racial."],
1,"'Vidas Secas' é romance regionalista da 2ª fase (1938), com crítica social e linguagem seca. Não é experimentação da 1ª fase (A), nem rigor formal da 3ª (C), nem Romantismo (D) nem Naturalismo racial (E)."
],
"Concretismo":[
"O Concretismo foi um movimento de vanguarda brasileiro (anos 1950), liderado por Augusto de Campos, Haroldo de Campos e Décio Pignatari. Propunha a poesia concreta: o poema como objeto visual, com valorização do espaço gráfico, da sonoridade e da estrutura, abolindo o verso tradicional. A palavra é tratada como material plástico.",
["Anos 1950","Poesia visual e espacial","Augusto e Haroldo de Campos, Décio Pignatari","Ruptura com o verso tradicional"],
"Se um poema explora a disposição gráfica das palavras na página, é provavelmente concreto. O visual faz parte do sentido.",
"Texto de autoria própria (adaptado): “Na poesia concreta, as palavras são dispostas no papel como formas: 'sol' pode ocupar o centro da página, e 'sombra' pode contorná-lo. O espaço em branco também significa.”",
"Sobre o Concretismo, é correto afirmar:",
["Pertence ao Romantismo, pela subjetividade.","É movimento dos anos 1950 que explora a visualidade e o espaço gráfico na poesia.","É movimento barroco de conflito religioso.","Pertence ao Parnasianismo, pela forma fixa.","É movimento de poesia oral e marginal."],
1,"O Concretismo (anos 1950) valoriza a disposição gráfica, o espaço e a materialidade da palavra. Não é Romantismo (A), Barroco (C) nem Parnasianismo (D). A poesia marginal é outro movimento."
],
"Poesia marginal":[
"A poesia marginal (ou 'geração mimeógrafo') surgiu nos anos 1970, à margem do circuito editorial oficial. Poetas como Ana Cristina Cesar, Cacaso, Chacal e Torquato Neto produziam livros artesanais, com linguagem coloquial, cotidiana e experimental. Marcada pela contracultura e pela resistência à ditadura.",
["Anos 1970","'Geração mimeógrafo'","Linguagem coloquial e cotidiana","Ana Cristina Cesar, Cacaso, Chacal"],
"Não confunda poesia marginal (anos 1970) com literatura marginal/periférica (anos 2000, como Ferréz). São movimentos distintos.",
"Texto de autoria própria (adaptado): “Nos anos 1970, jovens poetas imprimiam seus versos em mimeógrafos e vendiam os livretos em bares e shows. A linguagem era direta, falada, sem academicismo. Era a poesia marginal.”",
"Sobre a poesia marginal, é correto afirmar:",
["Surgiu nos anos 1950, com os concretos.","Foi um movimento dos anos 1970, com edição artesanal e linguagem coloquial.","Pertence ao Modernismo de 22.","É o mesmo que literatura periférica contemporânea.","Foi um movimento parnasiano."],
1,"A poesia marginal é dos anos 1970, com edição mimeografada e linguagem coloquial. Não é concretismo (A), Modernismo de 22 (C) nem Parnasianismo (E). A literatura periférica é outro movimento (D)."
],
"Literatura de cordel":[
"A literatura de cordel é uma manifestação popular nordestina, com origens no século XIX, que chega ao Brasil com os colonizadores. Tradicionalmente impressa em folhetos pendurados em cordões ('cordéis'), é escrita em versos rimados, geralmente sextilhas ou septilhas, e aborda temas como religião, política, amor, humor e crítica social. Autores como Patativa do Assaré são referência.",
["Origem popular nordestina","Folhetos pendurados em cordel","Versos rimados (sextilha, septilha)","Patativa do Assaré","Temas sociais, humor e religião"],
"O cordel é gênero literário e suporte (folheto). No ENEM, pode aparecer como texto para interpretação ou como referência cultural.",
"Texto de autoria própria (adaptado, em estilo de cordel): “Seu doutor, preste atenção / no que vou lhe perguntar: / por que tanta desigualdade / se o país tem tanto mar? / O povo trabalha e sofre, / mas não consegue avançar.”",
"O trecho é exemplo de:",
["Poema parnasiano.","Literatura de cordel: versos rimados, linguagem popular e crítica social.","Soneto barroco.","Poesia concreta.","Crônica jornalística."],
1,"Os versos rimados, a linguagem popular e a crítica social são marcas do cordel. Não é Parnasianismo (A), Barroco (C), Concretismo (D) nem crônica (E)."
],
"Literatura contemporânea":[
"A literatura brasileira contemporânea (a partir dos anos 1960-70) é marcada por pluralidade de vozes, mistura de gêneros, metalinguagem, narrativas fragmentadas, crítica ao cânone e à sociedade. Autores como Clarice Lispector, Guimarães Rosa, Hilda Hilst, Rubem Fonseca, Milton Hatoum, Conceição Evaristo, Ferréz e Itamar Vieira Junior compõem esse panorama diverso.",
["Pluralidade de vozes","Mistura de gêneros e linguagens","Crítica ao cânone","Conceição Evaristo, Ferréz, Itamar Vieira Junior"],
"ENEM tem cobrado com frequência a literatura marginal/periférica e autoras negras e indígenas, como Conceição Evaristo.",
"Texto de autoria própria (adaptado, com base em características da obra de Conceição Evaristo): “A escrevivência — escrever a partir da própria experiência — tornou-se chave para se pensar uma literatura afro-brasileira que fala da dor, mas também da potência das mulheres negras.”",
"Sobre o termo 'escrevivência', é correto afirmar:",
["Designa uma técnica de escrita automática surrealista.","É um conceito da escritora Conceição Evaristo: escrever a partir da experiência vivida, sobretudo das mulheres negras brasileiras.","Designa o romance regionalista de 30.","É sinônimo de literatura de cordel.","Foi cunhado por Machado de Assis."],
1,"'Escrevivência' é conceito cunhado por Conceição Evaristo, que articula escrita e experiência de vida. Não é surrealismo (A), regionalismo (C), cordel (D) nem criação machadiana (E)."
],
"Literaturas africanas e indígenas de língua portuguesa":[
"As literaturas africanas de língua portuguesa (Angola, Moçambique, Cabo Verde, Guiné-Bissau, São Tomé e Príncipe) surgem no contexto colonial e pós-colonial, com autores como Pepetela, Mia Couto, Ondjaki e Noémia de Sousa. A literatura indígena contemporânea, com autores como Ailton Krenak, Eliane Potiguara e Daniel Munduruku, afirma vozes e cosmologias originárias, muitas vezes em diálogo com a escrita em português.",
["Contexto colonial e pós-colonial","Mia Couto, Pepetela, Ondjaki","Literatura indígena contemporânea","Afirmação de identidades e cosmologias"],
"Não confunda literatura africana de língua portuguesa com literatura brasileira: são tradições distintas, com história própria.",
"Texto de autoria própria (adaptado): “Em Terra Sonâmbula, Mia Couto entrelaça histórias de Moçambique devastado pela guerra, com uma linguagem que reinventa o português, mesclando oralidade e neologismos.”",
"Sobre o autor e a obra, é correto afirmar:",
["Mia Couto é autor brasileiro, ligado ao regionalismo de 30.","Mia Couto é autor moçambicano que reinventa a língua portuguesa, mesclando oralidade e neologismos em obras como Terra Sonâmbula.","Terra Sonâmbula é romance português do século XIX.","Mia Couto é autor angolano de literatura colonial.","Terra Sonâmbula é obra de literatura indígena."],
1,"Mia Couto é moçambicano e sua obra reinventa o português, misturando oralidade, neologismos e tradições. Não é brasileiro (A) nem português (C) nem angolano (D) nem indígena (E)."
],
"Coesão referencial e anáfora":[
"Coesão referencial é o mecanismo que liga partes do texto por meio de retomadas: pronomes, sinônimos, elipses, numerais, advérbios. A anáfora é a retomada de um termo já mencionado (referência retrospectiva); a catáfora é a antecipação de um termo que ainda será mencionado (referência prospectiva). Ambas garantem a continuidade e evitam repetições.",
["Anáfora: retomada de termo anterior","Catáfora: antecipação de termo posterior","Pronomes, sinônimos, elipse","Coesão ≠ coerência"],
"'Comprei um livro. Ele é ótimo.' — 'Ele' é anáfora de 'livro'. 'Quero isto: paz.' — 'isto' é catáfora de 'paz'.",
"Texto de autoria própria: “O diretor chamou o aluno. Ele estava apreensivo.”",
"A palavra 'Ele', no trecho, é exemplo de:",
["Catáfora, pois antecipa um termo.","Anáfora, pois retoma 'o aluno'.","Coesão lexical por sinônimo.","Coesão por elipse.","Coesão sequencial."],
1,"'Ele' retoma 'o aluno', termo já mencionado: é anáfora. Não antecipa (A), não é sinônimo (C), elipse (D) nem conectivo (E)."
],
"Coesão lexical":[
"A coesão lexical é feita por meio de sinônimos, hiperônimos, hipônimos, repetições controladas e associações de sentido. Ela evita repetições desnecessárias e garante a continuidade temática. Não se confunde com coesão referencial (pronomes), embora ambas atuem juntas.",
["Sinônimos e antônimos","Hiperônimos e hipônimos","Repetição controlada","Evita repetições"],
"'Animal' é hiperônimo de 'cachorro'; 'cachorro' é hipônimo de 'animal'. Usar 'o animal' para retomar 'cachorro' é coesão lexical.",
"Texto de autoria própria: “Comprei um cachorro. O animal é brincalhão e late muito.”",
"A expressão 'O animal' retoma 'cachorro' por:",
["Coesão referencial por pronome.","Coesão lexical por hiperônimo.","Coesão sequencial por conectivo.","Coesão por elipse.","Coesão por substituição pronominal."],
1,"'Animal' é hiperônimo de 'cachorro': trata-se de coesão lexical por hiperônimo. Não é pronome (A), conectivo (C), elipse (D) nem substituição pronominal (E)."
],
"Coesão por elipse":[
"A elipse é a omissão de um termo que pode ser facilmente recuperado pelo contexto. É um recurso de coesão que evita repetições e torna o texto mais econômico. Exemplo: 'Ele comprou pão; eu, queijo' — o verbo 'comprei' está elíptico.",
["Omissão de termo recuperável","Evita repetição","Coesão por elipse","Comum em coordenações"],
"Se o texto omite um termo mas o leitor o recupera pela gramática ou pelo sentido, há elipse.",
"Texto de autoria própria: “Maria prefere café; João, chá.”",
"No trecho, a vírgula após 'João' marca:",
["Erro de pontuação.","Elipse do verbo 'prefere'.","Separação de sujeito e predicado.","Vocativo.","Aposto."],
1,"A vírgula indica a elipse do verbo 'prefere' ('João prefere chá'). É coesão por elipse. Não é erro (A), nem separa sujeito e predicado (C), nem vocativo (D) nem aposto (E)."
],
"Coesão sequencial e conectivos":[
"A coesão sequencial liga enunciados por conectivos que estabelecem relações de sentido: adição ('e', 'além disso'), oposição ('mas', 'porém'), causa ('porque', 'pois'), conclusão ('portanto', 'logo'), tempo ('quando', 'enquanto'). O uso adequado desses elementos é o que garante a progressão e a clareza.",
["Adição: e, também, além disso","Oposição: mas, porém, contudo","Causa: porque, pois, já que","Conclusão: portanto, logo","Tempo: quando, enquanto"],
"Cada conectivo carrega uma relação específica. Trocar 'mas' por 'portanto' muda o sentido. Preste atenção ao valor semântico.",
"Texto de autoria própria: “Estudou muito para a prova. ______, não obteve a nota esperada.”",
"Qual conectivo completa adequadamente, expressando oposição?",
["Portanto","Além disso","No entanto","Porque","Assim"],
2,"'No entanto' expressa oposição (contraste entre estudar e não obter resultado). 'Portanto' e 'assim' indicariam conclusão; 'além disso', adição; 'porque', causa."
],
"Operadores argumentativos":[
"Operadores argumentativos são palavras que orientam a argumentação, indicando a força dos argumentos: 'até', 'mesmo', 'inclusive' (inclusão); 'aliás', 'além disso' (soma); 'mas', 'porém' (oposição); 'portanto' (conclusão). Escolher bem o operador é decidir o rumo do raciocínio.",
["Orientam a argumentação","Indicam soma, oposição, conclusão","'Até' e 'mesmo' reforçam","'Mas' introduz o argumento mais forte"],
"Em 'Ele é inteligente, mas preguiçoso', o 'mas' indica que a segunda qualidade é decisiva. Trocar a ordem muda tudo.",
"Texto de autoria própria: “O candidato tem boa formação, ______ nunca ocupou cargo de gestão. Isso pesa contra ele.”",
"O operador que preenche a lacuna com valor de oposição é:",
["portanto","e","mas","porque","logo"],
2,"'Mas' introduz o argumento contrário (falta de experiência). 'Portanto' e 'logo' indicam conclusão; 'e' soma; 'porque' causa."
],
"Paralelismo sintático-semântico":[
"O paralelismo é a repetição de estruturas gramaticais semelhantes em uma sequência, garantindo ritmo, clareza e coesão. O paralelismo sintático repete a mesma estrutura; o semântico, a mesma relação de sentido. A quebra de paralelismo gera estranheza ou ambiguidade.",
["Repetição de estruturas","Garante ritmo e clareza","Paralelismo sintático e semântico","Quebra gera estranheza"],
"Em enumerações, mantenha a mesma estrutura: 'ele canta, dança e toca' (verbos), não 'ele canta, dança e é músico'.",
"Texto de autoria própria: “A proposta visa reduzir custos, melhorar o atendimento e ampliar o acesso.”",
"O trecho apresenta:",
["Quebra de paralelismo.","Paralelismo sintático: três verbos no infinitivo em sequência.","Erro de concordância.","Ambiguidade.","Coesão referencial."],
1,"Os três verbos no infinitivo ('reduzir', 'melhorar', 'ampliar') mantêm a mesma estrutura, configurando paralelismo sintático. Não há quebra (A), erro (C), ambiguidade (D) nem foco referencial (E)."
],
"Coerência textual":[
"Coerência é a unidade de sentido do texto: as partes devem fazer sentido entre si, respeitando a lógica, o contexto e o conhecimento partilhado. Um texto pode ser coeso (bem costurado) e incoerente (sem sentido). Envolve também a adequação ao gênero e a não contradição.",
["Sentido global","Não contradição","Adequação ao contexto","Coerência ≠ coesão"],
"Um texto com conectivos adequados pode ainda ser incoerente se as ideias se contradizem ou fogem do tema.",
"Texto de autoria própria: “Chovia muito. Por isso, ninguém saiu de casa. No entanto, as ruas ficaram cheias, e o comércio fez o melhor dia do ano.”",
"Sobre o texto, é correto afirmar:",
["É plenamente coerente, pois os fatos se encaixam.","É coeso, mas incoerente: as informações se contradizem (chuva forte e ruas cheias).","É incoerente, mas sem nenhum conectivo.","É coerente, pois a chuva sempre traz mais clientes.","É incoerente apenas por falta de pontuação."],
1,"Há conectivos adequados (coesão), mas as informações se contradizem (incoerência): se chove muito, espera-se ruas vazias. A alternativa D tenta justificar o ilógico; A e E não captam a contradição."
],
"Metáfora e comparação":[
"Metáfora é a substituição do termo próprio por outro, com base em semelhança implícita ('meu coração é um deserto'). Comparação (ou símile) usa conector explícito, geralmente 'como': 'meu coração é como um deserto'. A metáfora é mais condensada; a comparação, mais explícita.",
["Metáfora: sem conectivo","Comparação: com 'como', 'tal qual'","Base: semelhança","Metáfora ≠ metonímia"],
"Procure o 'como'. Se houver, é comparação. Sem ele, é metáfora (quando a base é semelhança).",
"Texto de autoria própria: “Meus olhos são dois faróis acesos na escuridão.”",
"Qual figura de linguagem predomina?",
["Metonímia.","Hipérbole.","Metáfora.","Eufemismo.","Antítese."],
2,"Há semelhança implícita entre olhos e faróis (ambos iluminam), sem uso de 'como'. É metáfora. Não é metonímia (A, que é troca por contiguidade), nem hipérbole (B, exagero), nem eufemismo (D), nem antítese (E)."
],
"Metonímia e sinédoque":[
"Metonímia é a substituição de um termo por outro com base em relação de contiguidade: autor pela obra ('ler Machado'), marca pelo produto ('um bom vinho do Porto'), parte pelo todo ('teto para todos'). Sinédoque é uma forma específica de metonímia: parte pelo todo, singular pelo plural, etc.",
["Metonímia: contiguidade","Autor pela obra, marca pelo produto","Sinédoque: parte pelo todo","Metonímia ≠ metáfora"],
"Metáfora é semelhança; metonímia é proximidade/contiguidade. Se você 'bebe um Porto', é metonímia.",
"Texto de autoria própria: “Li um Machado inteiro nas férias; depois, fui ao teatro ver um Shakespeare.”",
"Nos dois casos, há:",
["Metáfora, por semelhança.","Metonímia: o autor é tomado pela obra.","Hipérbole, por exagero.","Antítese, por oposição.","Personificação, por animação."],
1,"'Um Machado' e 'um Shakespeare' substituem as obras pelos autores. É metonímia (autor pela obra). Não há semelhança (A), exagero (C), oposição (D) nem atribuição de vida (E)."
],
"Antítese e paradoxo":[
"Antítese é a aproximação de termos de sentido contrário ('o amor e o ódio convivem'). Paradoxo é a união de ideias contraditórias numa mesma proposição, produzindo um sentido que ultrapassa a lógica comum ('é um silêncio ensurdecedor'). A antítese opõe; o paradoxo funde.",
["Antítese: oposição de termos","Paradoxo: contradição fundida","Antítese separa; paradoxo une","Ambos produzem efeito expressivo"],
"Se as ideias se opõem mantendo-se separadas, é antítese. Se se fundem de modo ilógico, é paradoxo.",
"Texto de autoria própria: “Ele era um cego que via tudo; um mudo que tudo dizia.”",
"Qual figura de linguagem predomina?",
["Metonímia.","Paradoxo.","Comparação.","Eufemismo.","Hipérbole."],
1,"As ideias se fundem em contradição (cego que vê, mudo que diz), o que caracteriza paradoxo. Não é metonímia (A), comparação (C, sem 'como'), eufemismo (D) nem hipérbole (E)."
],
"Hipérbole, eufemismo e personificação":[
"Hipérbole é o exagero intencional ('chorei rios de lágrimas'). Eufemismo é a suavização de ideias desagradáveis ('ele nos deixou' em vez de 'morreu'). Personificação (prosopopeia) atribui características humanas a seres inanimados ('o vento sussurrava segredos').",
["Hipérbole: exagero","Eufemismo: suavização","Personificação: traços humanos a não humanos"],
"Reconheça pelo efeito: exagero, suavização ou humanização. Cada uma produz uma emoção distinta.",
"Texto de autoria própria: “A cidade dormia, e o rio contava histórias antigas às pedras da margem.”",
"Qual figura predomina?",
["Hipérbole.","Eufemismo.","Personificação.","Antítese.","Metonímia."],
2,"Atribuem-se ações humanas (dormir, contar histórias) a seres inanimados (cidade, rio). É personificação/prosopopeia. Não há exagero (A), suavização (B), oposição (D) nem contiguidade (E)."
],
"Ironia e ambiguidade":[
"Ironia é dizer o contrário do que se quer significar, contando com a cumplicidade do leitor. Ambiguidade é a duplicidade de sentido, que pode ser intencional (recurso expressivo) ou acidental (defeito). O ENEM cobra a ironia como crítica e a ambiguidade como recurso ou problema, conforme o contexto.",
["Ironia: sentido invertido","Ambiguidade: duplo sentido","Pode ser intencional (arte) ou acidental (defeito)","O contexto decide"],
"Nem toda ambiguidade é erro: em literatura e publicidade, ela pode ser recurso expressivo.",
"Texto de autoria própria: “Que sorte a minha! Peguei um trânsito maravilhoso hoje: duas horas parado na mesma avenida.”",
"O efeito predominante é:",
["Ambiguidade.","Ironia: a palavra 'sorte' e o adjetivo 'maravilhoso' dizem o contrário do que se quer expressar.","Eufemismo.","Metonímia.","Hipérbole sem ironia."],
1,"'Que sorte' e 'maravilhoso' contrastam com a experiência negativa (trânsito parado). É ironia. Não é ambiguidade (A), eufemismo (C), metonímia (D) nem hipérbole isolada (E)."
],
"Sinestesia":[
"A sinestesia é a mistura de sensações de sentidos diferentes: 'doce silêncio' (paladar + audição), 'cor quente' (visão + tato). É uma figura de linguagem que explora a inter-relação dos sentidos, muito comum na poesia simbolista e na publicidade.",
["Mistura de sentidos","'Doce silêncio'","Comum no Simbolismo","Efeito sensorial"],
"Se a frase junta sensações de sentidos distintos, é sinestesia. Não confunda com metáfora simples.",
"Texto de autoria própria: “O perfume áspero daquela manhã invadia a sala.”",
"Qual figura de linguagem predomina?",
["Metonímia.","Sinestesia: mistura de olfato ('perfume') com tato ('áspero').","Hipérbole.","Antítese.","Eufemismo."],
1,"'Perfume áspero' mistura olfato e tato: é sinestesia. Não é metonímia (A), hipérbole (C), antítese (D) nem eufemismo (E)."
],
"Gradação":[
"A gradação é a apresentação de ideias em escala ascendente ou descendente, criando intensidade. Exemplo: 'Ele chorou, gritou, esperneou, desmaiou.' A sequência intensifica a emoção ou a ação.",
["Sequência em escala","Ascendente ou descendente","Intensifica a emoção","Também chamada clímax"],
"'Ele correu, correu, correu até cair' é gradação. A repetição intensifica a ação.",
"Texto de autoria própria: “O fogo começou pequeno, cresceu, alastrou-se, consumiu tudo.”",
"Qual figura predomina?",
["Antítese.","Gradação: sequência que intensifica a ação do fogo.","Paradoxo.","Metonímia.","Ironia."],
1,"A sequência 'pequeno → cresceu → alastrou → consumiu' intensifica progressivamente a ação. É gradação. Não é antítese (A), paradoxo (C), metonímia (D) nem ironia (E)."
],
"Figuras sonoras: aliteração, assonância e onomatopeia":[
"As figuras sonoras exploram a sonoridade das palavras. Aliteração é a repetição de sons consonantais ('o rato roeu a roupa do rei de Roma'). Assonância é a repetição de sons vocálicos ('a vida é uma loteria'). Onomatopeia é a reprodução de sons naturais por palavras ('tic-tac', 'miau'). São muito usadas na poesia e na publicidade.",
["Aliteração: repetição de consoantes","Assonância: repetição de vogais","Onomatopeia: imitação de sons","Efeito sonoro expressivo"],
"Aliteração: consoantes (R, S, M). Assonância: vogais (A, E, O). Onomatopeia: som real (bum, tic-tac).",
"Texto de autoria própria: “O silvo do vento sussurrava segredos soturnos.”",
"A repetição do som /s/ no trecho é exemplo de:",
["Assonância.","Onomatopeia.","Aliteração.","Paronomásia.","Sinestesia."],
2,"A repetição do som consonantal /s/ ('silvo', 'sussurrava', 'segredos', 'soturnos') é aliteração. Não é assonância (A, que repete vogais), onomatopeia (B, que imita sons), paronomásia (D) nem sinestesia (E)."
],
"Classes de palavras":[
"As dez classes de palavras são: substantivo, artigo, adjetivo, numeral, pronome, verbo, advérbio, preposição, conjunção e interjeição. Cada uma tem função e comportamento próprios. Substantivos nomeiam; adjetivos caracterizam; verbos indicam ação, estado ou fenômeno; advérbios modificam verbos, adjetivos ou outros advérbios.",
["Substantivo nomeia","Adjetivo caracteriza","Verbo indica ação, estado, fenômeno","Advérbio modifica","Conjunção e preposição ligam"],
"Analise a função na frase, não a palavra isolada: 'casa' pode ser substantivo ou verbo ('ele casa amanhã').",
"Texto de autoria própria: “Amanhã, cedo, os alunos estudiosos farão a prova com calma.”",
"Na frase, 'cedo' e 'calma' classificam-se, respectivamente, como:",
["Adjetivo e advérbio.","Advérbio e substantivo.","Advérbio e advérbio.","Substantivo e adjetivo.","Adjetivo e adjetivo."],
1,"'Cedo' modifica o verbo 'farão' (advérbio de tempo). 'Calma' vem precedido de preposição e artigo ('com a calma'), funcionando como substantivo. As demais combinações erram a classe."
],
"Estrutura e formação das palavras":[
"As palavras são formadas por elementos mórficos: radical (base do significado), prefixo (antes do radical), sufixo (depois do radical), desinências (indicam flexões) e vogal temática. Os processos de formação incluem derivação (prefixal, sufixal, parassintética, regressiva, imprópria) e composição (justaposição e aglutinação).",
["Radical: base do significado","Prefixos e sufixos","Derivação e composição","Palavras primitivas e derivadas"],
"'Infelizmente' = in- (prefixo) + feliz (radical) + -mente (sufixo). É derivação prefixal e sufixal.",
"Texto de autoria própria: “A infelicidade daquela deslealdade era evidente.”",
"A palavra 'deslealdade' foi formada por:",
["Composição por justaposição.","Derivação prefixal e sufixal.","Derivação regressiva.","Composição por aglutinação.","Onomatopeia."],
1,"'Deslealdade' = des- (prefixo) + leal (radical) + -dade (sufixo). É derivação prefixal e sufixal. Não é composição (A, D), derivação regressiva (C) nem onomatopeia (E)."
],
"Sujeito e predicado":[
"O sujeito é o termo sobre o qual se declara algo; o predicado é o que se declara. O sujeito pode ser simples, composto, oculto (implícito), indeterminado ou inexistente. O predicado pode ser verbal, nominal ou verbo-nominal. Reconhecer o sujeito é o primeiro passo para a concordância.",
["Sujeito: sobre quem se declara","Predicado: o que se declara","Simples, composto, oculto, indeterminado, inexistente","Predicado verbal, nominal, verbo-nominal"],
"Em 'Havia muitos alunos', o verbo 'haver' (no sentido de existir) é impessoal: não há sujeito.",
"Texto de autoria própria: “Choveu forte durante toda a madrugada.”",
"Quanto ao sujeito, é correto afirmar:",
["É simples: 'forte'.","É indeterminado.","O verbo 'chover' é impessoal; a oração não tem sujeito.","É oculto: 'ele'.","É composto."],
2,"Verbos que indicam fenômenos da natureza (chover, nevar, ventar), no sentido literal, são impessoais: a oração não tem sujeito. As demais alternativas forçam um sujeito inexistente."
],
"Vozes verbais":[
"As vozes verbais indicam a relação entre o sujeito e a ação. Voz ativa: o sujeito pratica a ação. Voz passiva: o sujeito sofre a ação. Voz reflexiva: o sujeito pratica e sofre a ação. A passiva pode ser analítica (ser + particípio) ou sintética (verbo + se).",
["Ativa: sujeito agente","Passiva: sujeito paciente","Reflexiva: sujeito agente e paciente","Passiva analítica e sintética"],
"Na passiva analítica, o agente pode ser introduzido por 'por'. Na sintética, usa-se 'se' apassivador.",
"Texto de autoria própria: “A ponte foi construída pelos engenheiros.”",
"Na frase, a voz verbal é:",
["Ativa.","Passiva analítica.","Reflexiva.","Passiva sintética.","Neutra."],
1,"'Foi construída' é locução passiva analítica (ser + particípio), e 'pelos engenheiros' é o agente da passiva. Não é ativa (A), reflexiva (C) nem passiva sintética (D)."
],
"Período composto por coordenação":[
"No período composto por coordenação, as orações são independentes entre si, ligadas por conjunções coordenativas ou justapostas. Classificam-se em aditivas, adversativas, alternativas, conclusivas e explicativas. Cada oração tem sentido próprio.",
["Orações independentes","Aditivas, adversativas, alternativas","Conclusivas e explicativas","Conjunções coordenativas"],
"'Estudou muito, mas não passou': coordenada adversativa. 'Estudou muito, portanto passou': conclusiva.",
"Texto de autoria própria: “Ele estudou muito, portanto foi aprovado.”",
"A oração destacada é coordenada:",
["Aditiva.","Adversativa.","Conclusiva.","Alternativa.","Explicativa."],
2,"'Portanto' introduz conclusão: oração coordenada conclusiva. Não é aditiva (A), adversativa (B), alternativa (D) nem explicativa (E)."
],
"Período composto por subordinação":[
"No período composto por subordinação, uma oração exerce função sintática de outra: substantiva, adjetiva ou adverbial. As subordinadas substantivas completam o sentido da principal; as adjetivas caracterizam um termo; as adverbiais indicam circunstâncias.",
["Orações dependentes","Substantivas, adjetivas, adverbiais","Função sintática","Conjunções subordinativas"],
"'Espero que você venha' — subordinada substantiva objetiva direta. 'O livro que li é bom' — subordinada adjetiva restritiva.",
"Texto de autoria própria: “Quando o sol nasceu, os pássaros cantaram.”",
"A oração 'Quando o sol nasceu' é subordinada adverbial:",
["Causal.","Temporal.","Condicional.","Consecutiva.","Final."],
1,"'Quando' introduz circunstância de tempo: subordinada adverbial temporal. Não é causal (A), condicional (C), consecutiva (D) nem final (E)."
],
"Concordância verbal e nominal":[
"Concordância verbal é a harmonia entre o verbo e o sujeito em número e pessoa. Concordância nominal é a harmonia entre o substantivo e seus determinantes (artigo, adjetivo, pronome, numeral) em gênero e número. Casos especiais: 'haver' impessoal, 'fazer' indicando tempo, sujeito coletivo, expressões partitivas.",
["Verbo concorda com o sujeito","Adjetivo concorda com o substantivo","'Haver' (existir) é impessoal","Casos especiais exigem atenção"],
"'Faz dez anos' (não 'fazem'). 'Havia muitas pessoas' (não 'haviam').",
"Texto de autoria própria: “______ dez anos que ele partiu. ______ muitas saudades naquela casa.”",
"Preenchem corretamente as lacunas:",
["Fazem / Haviam","Faz / Havia","Fazem / Havia","Faz / Haviam","Faz / Havia"],
1,"'Fazer' indicando tempo decorrido é impessoal: 'Faz dez anos'. 'Haver' no sentido de existir é impessoal: 'Havia muitas saudades'. As formas no plural estão incorretas nesses usos."
],
"Regência, crase e colocação pronominal":[
"Regência é a relação de dependência entre um termo e seu complemento ('assistir ao filme', 'preferir A a B'). Crase é a fusão de 'a' (preposição) + 'a' (artigo ou pronome demonstrativo), marcada por acento grave. Colocação pronominal trata da posição dos pronomes oblíquos átonos: próclise, mesóclise e ênclise.",
["Regência: relação verbo/nome e complemento","Crase: 'a' + 'a'","Próclise, mesóclise, ênclise","Palavras atrativas exigem próclise"],
"'Assistir' no sentido de ver pede preposição: 'assisti ao filme'. 'Aspirar' no sentido de desejar também: 'aspiro ao cargo'.",
